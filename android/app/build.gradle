plugins {
    id 'com.android.application'
}

def uploadKeyStorePath = System.getenv("DEEPFOCUS_UPLOAD_KEYSTORE") ?: "zenfocus2026.jks"
def uploadKeyAlias = System.getenv("DEEPFOCUS_KEY_ALIAS") ?: "zenfocus2026"
def uploadStorePassword = System.getenv("DEEPFOCUS_STORE_PASSWORD") ?: "zenfocus2026"
def uploadKeyPassword = System.getenv("DEEPFOCUS_KEY_PASSWORD") ?: "zenfocus2026"

android {
    namespace 'com.zenstudy.focus'
    compileSdk 35

    defaultConfig {
        applicationId "com.deepfocus.study"
        minSdk 24
        targetSdk 35
        versionCode 41270
        versionName "550.0.0"
    }

    signingConfigs {
        release {
            storeFile file(uploadKeyStorePath)
            storePassword uploadStorePassword
            keyAlias uploadKeyAlias
            keyPassword uploadKeyPassword
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress 'json'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
