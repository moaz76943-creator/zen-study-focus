plugins {
    id 'com.android.application'
}

def uploadKeyStorePath = System.getenv('ZEN_UPLOAD_KEYSTORE_PATH')
def uploadKeyStorePassword = System.getenv('ZEN_UPLOAD_STORE_PASSWORD')
def uploadKeyAlias = System.getenv('ZEN_UPLOAD_KEY_ALIAS')
def uploadKeyPassword = System.getenv('ZEN_UPLOAD_KEY_PASSWORD')
def hasUploadSigning = [uploadKeyStorePath, uploadKeyStorePassword, uploadKeyAlias, uploadKeyPassword]
        .every { it != null && !it.trim().isEmpty() }

android {
    namespace 'com.zenstudy.focus'
    compileSdk 36
    defaultConfig {
        applicationId "com.zenstudy.focus"
        minSdk 24
        targetSdk 36
        versionCode 45
        versionName "3.5.25"
    }
    signingConfigs {
        if (hasUploadSigning) {
            upload {
                storeFile file(uploadKeyStorePath)
                storePassword uploadKeyStorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Never sign a Play Store release with Android's debug key.
            if (hasUploadSigning) signingConfig signingConfigs.upload
        }
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.10.0'
}
