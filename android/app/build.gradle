plugins {
    id 'com.android.application'
}

def verProps = new Properties()
def verPropsFile = rootProject.file("version.properties")
if (verPropsFile.exists()) {
    verPropsFile.withInputStream { verProps.load(it) }
}
def appVersionCode = (verProps.getProperty("VERSION_CODE") ?: "41274").toInteger()
def appVersionName = verProps.getProperty("VERSION_NAME") ?: "554.0.0"

def ksProps = new Properties()
def ksPropsFile = rootProject.file("keystore.properties")
if (ksPropsFile.exists()) {
    ksPropsFile.withInputStream { ksProps.load(it) }
}
def uploadKeyStorePath = System.getenv("DEEPFOCUS_UPLOAD_KEYSTORE") ?: ksProps.getProperty("storeFile")
def uploadKeyAlias = System.getenv("DEEPFOCUS_KEY_ALIAS") ?: ksProps.getProperty("keyAlias")
def uploadStorePassword = System.getenv("DEEPFOCUS_STORE_PASSWORD") ?: ksProps.getProperty("storePassword")
def uploadKeyPassword = System.getenv("DEEPFOCUS_KEY_PASSWORD") ?: ksProps.getProperty("keyPassword")
def hasReleaseSigning = uploadKeyStorePath && uploadKeyAlias && uploadStorePassword && uploadKeyPassword && file(uploadKeyStorePath).exists()

android {
    namespace 'com.zenstudy.focus'
    compileSdk 36

    defaultConfig {
        applicationId "com.deepfocus.study"
        minSdk 24
        targetSdk 36
        versionCode appVersionCode
        versionName appVersionName
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(uploadKeyStorePath)
                storePassword uploadStorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress 'json'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.12.0'
}
