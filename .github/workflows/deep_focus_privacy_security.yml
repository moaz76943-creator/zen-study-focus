name: Deep Focus Privacy and Code Security
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '41 3 * * 6'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deep-focus-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gitleaks:
    name: Redacted local-only secret scan (no artifact)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified tag commit
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Validate privacy-first contracts (no cloud credential access)
        run: python3 tools/tool_integrations/test_privacy_contract.py
      - name: Download and SHA256-verify pinned Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 2 \
            'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz' \
            -o "$RUNNER_TEMP/gitleaks.tgz"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"$RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks"
      - name: Scan checked-out tree; redact matches; NEVER upload results
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          set +e
          "$RUNNER_TEMP/gitleaks" dir --no-banner --redact --max-target-megabytes 10 --log-level error --report-format json --report-path "$RUNNER_TEMP/gitleaks-private.json" .
          status=$?
          set -e
          if [[ "$status" != 0 ]]; then
            python3 - "$RUNNER_TEMP/gitleaks-private.json" <<'PY'
          import json, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          if not path.exists():
              print('GITLEAKS ERROR: scan failed before a safe metadata report was produced')
              raise SystemExit(0)
          try:
              hits = json.loads(path.read_text())
              print('SECURITY BLOCKED: %d potential secrets found; rule IDs (no values): %s' %
                    (len(hits), ', '.join(sorted({str(x.get('RuleID', 'unknown')) for x in hits})[:12])))
          except Exception:
              print('SECURITY BLOCKED: could not parse local redacted findings')
          PY
          fi
          rm -f "$RUNNER_TEMP/gitleaks-private.json"
          if [[ "$status" != 0 ]]; then exit "$status"; fi
          echo 'Source-tree scan PASS (history and files >10 MiB not examined).'
  codeql:
    name: GitHub CodeQL (JavaScript / TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 28
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Analyze exact checked-out SHA (GitHub native security only)
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
        with:
          category: /language:javascript-typescript
