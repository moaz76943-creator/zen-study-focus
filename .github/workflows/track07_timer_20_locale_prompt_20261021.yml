name: Track07 Timer Mode Confirm 20 Locale Acceptance
on:
  push:
    branches:
      - fix/track07-timer-mode-20-locale-prompt-20261021
permissions:
  contents: read
concurrency:
  group: track07-mode-confirm-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source + 20 reviewed-language prompt
        run: node --test tests/track07_functional/timer_mode_20_locale_prompt.test.cjs tests/track07_functional/timer_mode_button_safety.test.cjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real Chromium Playwright browser
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.58.2
          if [[ ! -x /usr/bin/chromium ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq chromium
          fi
      - name: Serve actual bundled offline assets
        shell: bash
        run: |
          set -euo pipefail
          cd android/app/src/main/assets/web
          python3 -m http.server 8770 --bind 127.0.0.1 > "$RUNNER_TEMP/web.log" 2>&1 &
          for n in {1..30}; do curl -fsS http://127.0.0.1:8770/index.html >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Click real Short mode for all 20 locales and dismiss session discard
        env:
          DF_COMPLETION_URL: http://127.0.0.1:8770
          DF_TIMER_LOCALE_REPORT: ${{ runner.temp }}/timer-20-locales.json
        run: |
          node --check tests/track07_functional/timer_mode_20_locale_browser.cjs
          node tests/track07_functional/timer_mode_20_locale_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: track07-timer-20-locales-${{ github.sha }}
          path: ${{ runner.temp }}/timer-20-locales.json
          if-no-files-found: warn
          retention-days: 7
