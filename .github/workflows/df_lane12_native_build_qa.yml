name: DF-LANE-12 Native Android i18n source and build QA
on:
  push:
    branches: [lane12/native-android-i18n-20261025]
  pull_request:
    branches: [integration/master-qa-verified-v21]
permissions:
  contents: read
jobs:
  native-i18n:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate localized resources and native consent source
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/i18n/native_android -p 'test_*.py' -v
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install SDK platform and build tools for compileSdk 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compile non-release Android debug APK at exact checked-out source
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify built artifact exists, no production signing
        run: |
          set -euo pipefail
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk
          echo 'ANDROID_RUNTIME_NOT_TESTED'
          echo 'RELEASE_APPROVED=NO'
      - name: Android API30 install, launch and restart smoke (PR integration tree)
        if: github.event_name == 'pull_request'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm list packages | grep -Fx 'package:com.zenstudy.focus'
            adb shell am start -W -n com.zenstudy.focus/com.zenstudy.focus.MainActivity
            sleep 4
            adb shell pidof com.zenstudy.focus
            adb shell am force-stop com.zenstudy.focus
            adb shell am start -W -n com.zenstudy.focus/com.zenstudy.focus.MainActivity
            sleep 3
            adb shell pidof com.zenstudy.focus
            echo 'PASS: package identity, launch and restart on Android API30'
            echo 'SAF, notifications, talkback and API35: NOT_TESTED'

