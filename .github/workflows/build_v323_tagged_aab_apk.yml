# CI-only orchestrator: original application sources are always checked out from the immutable approved tag.
# The tag and official integration branch remain unchanged.
name: Deep Focus v3.2.3 Tagged Signed AAB and Debug APK
on:
  push:
    branches:
      - qa/build-v323-tag-pinned-20261023
    paths:
      - .github/workflows/build_v323_tagged_aab_apk.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deepfocus-v323-pinned-tag-release
  cancel-in-progress: false

jobs:
  play-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ZEN_UPLOAD_STORE_PASSWORD: ${{ secrets.ZEN_UPLOAD_STORE_PASSWORD }}
      ZEN_UPLOAD_KEY_ALIAS: ${{ secrets.ZEN_UPLOAD_KEY_ALIAS }}
      ZEN_UPLOAD_KEY_PASSWORD: ${{ secrets.ZEN_UPLOAD_KEY_PASSWORD }}
      ZEN_PLAY_UPLOAD_SHA1: ${{ secrets.ZEN_PLAY_UPLOAD_SHA1 }}
    steps:
      - name: Checkout immutable official v3.2.3 tag
        uses: actions/checkout@v4
        with:
          ref: 3cbd8d2b6ac7313ebb91ea9c9939d44e66772177
          persist-credentials: false
      - name: Verify pinned tag and prepare documented build-only startup fix
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=3cbd8d2b6ac7313ebb91ea9c9939d44e66772177
          test "$(git rev-parse HEAD)" = "$SOURCE"
          ACTUAL="$(git ls-remote origin 'refs/tags/v3.2.3-safe-i18n-v21^{}' | awk '{print $1}')"
          test "$ACTUAL" = "$SOURCE" || { echo "::error::Release tag mismatch"; exit 1; }
          python3 - <<'PY'
          from pathlib import Path
          g=Path('android/app/build.gradle').read_text()
          for expected in ('applicationId "com.deepfocus.study"', 'versionCode 22', 'versionName "3.1.3"'):
              assert expected in g, expected
          p=Path('android/app/src/main/java/com/zenstudy/focus/MainActivity.java')
          old='if (!"com.zenstudy.focus".equals(getPackageName())) {'
          new='if (!"com.deepfocus.study".equals(getPackageName())) {'
          s=p.read_text()
          assert s.count(old)==1 and s.count(new)==0, 'Unrecognized startup guard'
          p.write_text(s.replace(old,new,1))
          assert p.read_text().count(new)==1
          PY
          test "$(git diff --name-only)" = 'android/app/src/main/java/com/zenstudy/focus/MainActivity.java'
          cat > "$RUNNER_TEMP/provenance-v323-aab.txt" <<'EOF'
          tag=v3.2.3-safe-i18n-v21
          source_commit=3cbd8d2b6ac7313ebb91ea9c9939d44e66772177
          package=com.deepfocus.study
          versionCode=22
          versionName=3.1.3
          actual_source=tag_plus_build_only_MainActivity_package_guard_fix
          diff=MainActivity.java com.zenstudy.focus guard to com.deepfocus.study
          tag_and_official_branch_unchanged=true
          command=./gradlew clean bundleRelease --stacktrace
          google_play_console_acceptance=NOT_TESTED
          EOF
      - name: Load Play upload keystore (never use debug signing)
        shell: bash
        env:
          ZEN_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ZEN_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          for name in ZEN_UPLOAD_KEYSTORE_BASE64 ZEN_UPLOAD_STORE_PASSWORD ZEN_UPLOAD_KEY_ALIAS ZEN_UPLOAD_KEY_PASSWORD; do
            test -n "${!name:-}" || { echo "::error::Missing Play signing secret $name"; exit 1; }
          done
          umask 077
          STORE="$RUNNER_TEMP/v323-upload.jks"
          printf '%s' "$ZEN_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$STORE"
          test -s "$STORE"
          echo "ZEN_UPLOAD_KEYSTORE_PATH=$STORE" >> "$GITHUB_ENV"
          keytool -list -v -keystore "$STORE" -alias "$ZEN_UPLOAD_KEY_ALIAS" -storepass:env ZEN_UPLOAD_STORE_PASSWORD > "$RUNNER_TEMP/v323-certificate.txt"
          grep -Fq 'PrivateKeyEntry' "$RUNNER_TEMP/v323-certificate.txt"
          if [ -n "$ZEN_PLAY_UPLOAD_SHA1" ]; then
            EXPECTED="$(printf '%s' "$ZEN_PLAY_UPLOAD_SHA1" | tr '[:lower:]' '[:upper:]')"
            ACTUAL="$(grep -m1 'SHA1:' "$RUNNER_TEMP/v323-certificate.txt" | sed -E 's/^.*SHA1: *//;s/[[:space:]]+$//' | tr '[:lower:]' '[:upper:]')"
            test "$ACTUAL" = "$EXPECTED" || { echo "::error::Unexpected Play upload signing certificate"; exit 1; }
          fi
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          set -euo pipefail
          MANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager -print -quit)"
          "$MANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare wrapper
        working-directory: android
        run: |
          set -euo pipefail
          if [ ! -f ./gradlew ]; then gradle wrapper --gradle-version 8.11.1 --distribution-type bin --no-daemon; fi
          chmod +x ./gradlew
      - name: Build signed Google Play release AAB
        working-directory: android
        run: ./gradlew clean bundleRelease --stacktrace
      - name: Validate signed AAB metadata, integrity, checksum
        shell: bash
        run: |
          set -euo pipefail
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          unzip -tq "$AAB" > "$RUNNER_TEMP/v323-aab-ziptest.txt"
          unzip -Z -1 "$AAB" > "$RUNNER_TEMP/v323-aab-entries.txt"
          grep -Fxq 'base/assets/web/index.html' "$RUNNER_TEMP/v323-aab-entries.txt"
          jarsigner -verify -verbose -certs "$AAB" > "$RUNNER_TEMP/v323-aab-signature.txt" 2>&1
          grep -q 'jar verified' "$RUNNER_TEMP/v323-aab-signature.txt"
          grep -Eq '^META-INF/.*\.(RSA|DSA|EC)$' "$RUNNER_TEMP/v323-aab-entries.txt"
          curl --fail --location --retry 3 --silent --show-error 'https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar' -o "$RUNNER_TEMP/bundletool.jar"
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$AAB" > "$RUNNER_TEMP/v323-aab-manifest.xml"
          python3 - <<'PY'
          import os,xml.etree.ElementTree as ET
          from pathlib import Path
          f=Path(os.environ['RUNNER_TEMP'])/'v323-aab-manifest.xml'
          root=ET.fromstring(f.read_text())
          ns='{http://schemas.android.com/apk/res/android}'
          pkg=root.attrib.get('package')
          code=root.attrib.get(ns+'versionCode')
          ver=root.attrib.get(ns+'versionName')
          print('AAB',pkg,code,ver)
          assert pkg=='com.deepfocus.study'
          assert code=='22'
          assert ver=='3.1.3'
          PY
          sha256sum "$AAB" > "$RUNNER_TEMP/v323-aab-SHA256.txt"
          cat "$RUNNER_TEMP/v323-aab-SHA256.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload signed AAB and evidence
        uses: actions/upload-artifact@v4
        with:
          name: DeepFocus-v3.2.3-Tagged-v22-Play-SIGNED-AAB
          if-no-files-found: error
          retention-days: 30
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            ${{ runner.temp }}/v323-aab-SHA256.txt
            ${{ runner.temp }}/v323-aab-signature.txt
            ${{ runner.temp }}/v323-aab-manifest.xml
            ${{ runner.temp }}/provenance-v323-aab.txt

  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout immutable official v3.2.3 tag
        uses: actions/checkout@v4
        with:
          ref: 3cbd8d2b6ac7313ebb91ea9c9939d44e66772177
          persist-credentials: false
      - name: Verify pinned tag and apply same documented build-only guard fix
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=3cbd8d2b6ac7313ebb91ea9c9939d44e66772177
          test "$(git rev-parse HEAD)" = "$SOURCE"
          ACTUAL="$(git ls-remote origin 'refs/tags/v3.2.3-safe-i18n-v21^{}' | awk '{print $1}')"
          test "$ACTUAL" = "$SOURCE"
          python3 - <<'PY'
          from pathlib import Path
          g=Path('android/app/build.gradle').read_text()
          assert 'applicationId "com.deepfocus.study"' in g
          assert 'versionCode 22' in g
          p=Path('android/app/src/main/java/com/zenstudy/focus/MainActivity.java')
          old='if (!"com.zenstudy.focus".equals(getPackageName())) {'
          new='if (!"com.deepfocus.study".equals(getPackageName())) {'
          s=p.read_text()
          assert s.count(old)==1 and new not in s
          p.write_text(s.replace(old,new,1))
          PY
          test "$(git diff --name-only)" = 'android/app/src/main/java/com/zenstudy/focus/MainActivity.java'
          cat > "$RUNNER_TEMP/provenance-v323-apk.txt" <<'EOF'
          tag=v3.2.3-safe-i18n-v21
          source_commit=3cbd8d2b6ac7313ebb91ea9c9939d44e66772177
          package=com.deepfocus.study
          versionCode=22
          versionName=3.1.3
          actual_source=tag_plus_build_only_MainActivity_package_guard_fix
          signing=Android_debug_not_Play
          command=./gradlew assembleDebug --stacktrace
          EOF
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          set -euo pipefail
          MANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager -print -quit)"
          "$MANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare wrapper
        working-directory: android
        run: |
          set -euo pipefail
          if [ ! -f ./gradlew ]; then gradle wrapper --gradle-version 8.11.1 --distribution-type bin --no-daemon; fi
          chmod +x ./gradlew
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace
      - name: Verify debug APK package, signing and SHA256
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/v323-apk-signature.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > "$RUNNER_TEMP/v323-apk-badging.txt"
          grep -Fq "package: name='com.deepfocus.study' versionCode='22' versionName='3.1.3'" "$RUNNER_TEMP/v323-apk-badging.txt"
          unzip -Z -1 "$APK" | grep -Fxq 'assets/web/index.html'
          sha256sum "$APK" > "$RUNNER_TEMP/v323-apk-SHA256.txt"
          cat "$RUNNER_TEMP/v323-apk-SHA256.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: DeepFocus-v3.2.3-Tagged-v22-Debug-APK
          if-no-files-found: error
          retention-days: 30
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            ${{ runner.temp }}/v323-apk-SHA256.txt
            ${{ runner.temp }}/v323-apk-signature.txt
            ${{ runner.temp }}/v323-apk-badging.txt
            ${{ runner.temp }}/provenance-v323-apk.txt
