name: Deep Focus Control Center Quality Audit

on:
  pull_request:
    branches:
      - main
      - fix/v21-safe-release-recovery-20261018
      - integration/deep-focus-recovery-00-final-20261019
      - feature/control-center-ops-20261019
    paths:
      - ".github/workflows/control_center_audit.yml"
      - "tools/control_center/**"
      - "tests/control_center/**"
      - "docs/control-center/**"
      - "docs/recovery_integration/**"
      - "docs/MEDIA_LICENSES.md"
      - "android/app/src/main/assets/web/**"
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

concurrency:
  group: deep-focus-control-center
  cancel-in-progress: false

jobs:
  inspect:
    name: Source QA and report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Control Center regression tests
        run: node --test tests/control_center/*.test.cjs

      - name: Validate generated appearance CSS
        run: node tools/control_center/generate_style.cjs --check

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in android/app/src/main/assets/web/*.js docs/control-center/*.js tools/control_center/*.cjs; do
            node --check "$file"
          done

      - name: Bundle portable Android-phone dashboard
        run: |
          node tools/control_center/build_portable.cjs --output dist/deep-focus-control-center-mobile.html
          node tools/control_center/build_portable.cjs --check dist/deep-focus-control-center-mobile.html

      - name: Desktop Chrome smoke test of portable file
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v chromium || true)"
          if [[ -z "$browser" ]]; then
            echo "Portable file Chrome DOM smoke: **NOT_TESTED** (no browser installed)" >> "$GITHUB_STEP_SUMMARY"
          else
            timeout 45s "$browser" \
              --headless --no-sandbox --disable-dev-shm-usage --disable-gpu \
              --no-first-run --disable-extensions --disable-background-networking \
              --virtual-time-budget=4000 --dump-dom \
              "file://${GITHUB_WORKSPACE}/dist/deep-focus-control-center-mobile.html" \
              > dist/portable_chrome_dom.html 2> dist/portable_chrome_stderr.log
            node tools/control_center/check_portable_dom.cjs dist/portable_chrome_dom.html
            echo "Portable file desktop Chrome DOM boot: **PASS** (not Android WebView or physical touch QA)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Mobile viewport Chromium smoke (320/360/393/430)
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v chromium || true)"
          if [[ -z "$browser" ]]; then
            echo "Mobile viewport Chromium smoke: **NOT_TESTED** (no browser installed)" >> "$GITHUB_STEP_SUMMARY"
          else
            mkdir -p dist/mobile_chrome_qa
            for width in 320 360 393 430; do
              timeout 35s "$browser" \
                --headless --no-sandbox --disable-dev-shm-usage --disable-gpu \
                --no-first-run --disable-extensions --disable-background-networking \
                --force-device-scale-factor=1 --window-size="${width},760" \
                --virtual-time-budget=4000 --dump-dom \
                "file://${GITHUB_WORKSPACE}/dist/deep-focus-control-center-mobile.html" \
                > "dist/mobile_chrome_qa/viewport_${width}.html" \
                2> "dist/mobile_chrome_qa/stderr_${width}.log"
              node tools/control_center/check_portable_dom.cjs "dist/mobile_chrome_qa/viewport_${width}.html"
              echo "Chrome launch using requested ${width}px window: **PASS** (actual CSS width checked separately by CDP)" >> "$GITHUB_STEP_SUMMARY"
            done
          fi

      - name: Real Chromium Track 15 button and navigation interaction QA
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v chromium || true)"
          if [[ -z "$browser" ]]; then
            echo "Chrome simulated phone-click QA: **NOT_TESTED** (no browser installed)" >> "$GITHUB_STEP_SUMMARY"
          else
            node tools/control_center/mobile_interaction_bundle.cjs dist/track15-interactive-qa.html
            mkdir -p dist/mobile_chrome_qa
            for width in 320 360 393 430; do
              timeout 40s "$browser" \
                --headless --no-sandbox --disable-dev-shm-usage --disable-gpu \
                --no-first-run --disable-extensions --disable-background-networking \
                --force-device-scale-factor=1 --window-size="${width},760" \
                --virtual-time-budget=5000 --dump-dom \
                "file://${GITHUB_WORKSPACE}/dist/track15-interactive-qa.html" \
                > "dist/mobile_chrome_qa/interactions_${width}.html" \
                2> "dist/mobile_chrome_qa/interactions_stderr_${width}.log"
              node tools/control_center/check_mobile_interaction_dom.cjs "dist/mobile_chrome_qa/interactions_${width}.html"
              echo "Chrome window parameter ${width}px simulated button/navigation QA: **PASS** (actual width checked separately by CDP)" >> "$GITHUB_STEP_SUMMARY"
            done
          fi

      - name: Actual CSS mobile viewports and screenshot evidence (Chrome DevTools)
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v chromium || true)"
          if [[ -z "$browser" ]]; then
            echo "Actual 320/360/393/430 CSS viewport QA: **NOT_TESTED** (no browser)" >> "$GITHUB_STEP_SUMMARY"
          else
            BROWSER_BIN="$browser" timeout 120s node tools/control_center/chrome_mobile_cdp_qa.cjs dist/deep-focus-control-center-mobile.html
            echo "Exact CSS viewport 320/360/393/430, overflow and screenshots: **PASS** (Chrome emulation, not physical Android)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload mobile-sized Chromium DOM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deep-focus-control-center-mobile-chromium-evidence
          path: dist/mobile_chrome_qa/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload single-file mobile dashboard
        uses: actions/upload-artifact@v4
        with:
          name: deep-focus-control-center-mobile
          path: dist/deep-focus-control-center-mobile.html
          retention-days: 14
          if-no-files-found: error

      - name: Inspect static sources
        run: |
          node tools/control_center/audit.cjs \
            --json report/health.json \
            --markdown report/health.md

      - name: Summarize findings and release gates
        shell: bash
        run: |
          {
            echo "### Control Center — read-only quality audit"
            echo "Source SHA: $GITHUB_SHA"
            echo "Android physical-device QA: **NOT_TESTED**"
            echo "Release gate: **NOT APPROVED**"
            cat report/health.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: deep-focus-control-center-health
          path: report/
          retention-days: 14
          if-no-files-found: error

  triage:
    name: Create or update one reviewable issue
    needs: inspect
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Download inspected evidence
        uses: actions/download-artifact@v4
        with:
          name: deep-focus-control-center-health
          path: report

      - name: Upsert reviewable critical findings
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const report = JSON.parse(fs.readFileSync('report/health.json', 'utf8'));
            const blockers = Array.isArray(report.findings)
              ? report.findings.filter(x => x.severity === 'critical') : [];
            if (!blockers.length) {
              core.info('No critical finding; never auto-close a human issue.');
              return;
            }
            const {owner, repo} = context.repo;
            const title = '[Control Center] Automated source-quality blockers';
            const text = [
              '## Automated quality audit (review required)',
              '',
              'Static source findings only. No device, legal or audio listening review is claimed.',
              'Source SHA: ' + (report.inspected_ref || 'unknown'),
              'Device QA: NOT_TESTED. No patches, merges, signing or release.',
              '',
              ...blockers.slice(0, 30).flatMap(f => [
                '### ' + f.id + ': ' + f.title,
                f.detail,
                '',
                'Suggested remediation: ' + f.remediation,
                ''
              ]),
              'See workflow artifacts for machine-readable evidence.',
              'Recovery plan: https://github.com/' + owner + '/' + repo + '/issues/13'
            ].join('\n');
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state:'open', per_page:100
            });
            const existing = issues.find(x => !x.pull_request && x.title === title);
            if (existing) {
              if (existing.body !== text) {
                await github.rest.issues.update({owner, repo, issue_number:existing.number, body:text});
                core.info('Updated issue #' + existing.number);
              }
            } else {
              const created=await github.rest.issues.create({owner, repo, title, body:text});
              core.info('Created issue #' + created.data.number);
            }
