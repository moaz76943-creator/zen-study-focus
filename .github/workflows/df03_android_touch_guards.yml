name: DF03 Android touch geometry source tests
on:
  pull_request:
    branches: [integration/master-qa-verified-v21]
    paths:
      - 'tests/android_touch/**'
      - '.github/workflows/df03_android_touch_guards.yml'
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate transport/touch bounds without Android UI acceptance claims
        run: |
          node --check tests/android_touch/android_device_touch.cjs
          node --check tests/android_touch/cdp_touch_target.cjs
          node --test tests/android_touch/*.test.cjs
