name: Deep Focus Quality Center (source-only)

on:
  pull_request:
    branches:
      - integration/deep-focus-recovery-00-final-20261019
    paths:
      - .github/workflows/verify_quality_center.yml
      - tools/quality_center/**
      - tests/quality_center/**
      - docs/quality_center/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deep-focus-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-quality:
    name: Source regression only (NOT Android or release approval)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify dashboard syntax and self-tests
        run: |
          node --check tools/quality_center/run.cjs
          node --test tests/quality_center/*.test.cjs
      - name: Build quality report (retain expected provenance blocker)
        shell: bash
        run: |
          set +e
          node tools/quality_center/run.cjs --out reports/quality-center
          report_exit=$?
          set -e
          test -s reports/quality-center/report.json
          test -s reports/quality-center/index.html
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('reports/quality-center/report.json', 'utf8'));
          if (report.releaseReady !== false || !/BLOCKED/.test(report.releaseGate || '')) {
            throw new Error('Quality report must be fail-closed on unverified release conditions');
          }
          if (report.sourceSha !== process.env.GITHUB_SHA) {
            throw new Error('Report SHA must match the checked-out Actions revision');
          }
          const required = ['SOURCE','SYNTAX','AUDIO','BACKLOG','LOCALES','SMOKE','NODE_TESTS','MEDIA_RIGHTS','ANDROID_E2E','HUMAN_REVIEW'];
          if (required.some(id => !report.checks.some(c => c.id === id))) {
            throw new Error('Quality report missing a mandatory verification lane');
          }
          if (!report.backlog || !report.backlog.ok || report.backlog.total !== 161) {
            throw new Error('Official 161-task recovery matrix is missing or corrupted');
          }
          const unexpected = report.checks.filter(c => c.status === 'FAIL' && c.id !== 'MEDIA_RIGHTS');
          if (unexpected.length) {
            console.error('Unexpected source test failures:', unexpected.map(c => c.id));
            process.exitCode = 1;
          }
          const media = report.checks.find(c => c.id === 'MEDIA_RIGHTS');
          if (media.status === 'FAIL') {
            console.log('::warning::Media rights release gate is RED; Android release remains BLOCKED');
          } else if (media.status !== 'PASS') {
            console.error('Media gate did not execute cleanly');
            process.exitCode = 1;
          }
          console.log('Read-only dashboard result:', report.counts);
          console.log('::notice::Source-only check; no Android device, authentic audio listening or Play release approval');
          NODE
          if [ "$report_exit" -ne 0 ]; then
            echo "::notice::Dashboard process returned $report_exit; inspected JSON for evidence and unexpected failures"
          fi
      - name: Upload read-only quality dashboard
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: DeepFocus-Quality-Center-${{ github.run_id }}
          path: reports/quality-center/
          if-no-files-found: warn
          retention-days: 7
