name: Deep Focus Automated Release Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Release Bundle (AAB for Google Play)
        run: |
          cd android
          gradle :app:bundleRelease --no-daemon --stacktrace

      - name: Build Debug APK (For Direct Phone Testing)
        run: |
          cd android
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deep-focus-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deep-focus-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
