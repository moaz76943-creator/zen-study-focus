name: TRACK 04 exact-staged-source Android WebView touch QA
on:
  push:
    branches: [qa/track04-real-touch-outcomes-20261021]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: df-track04-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api30:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pin actual Android source to exact staged PR145 tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/df-track04-android"
          PIN=903989405c096f1bbfd414d24c2c06e988b0ec70
          git cat-file -e "$PIN^{commit}"
          test "$(git rev-parse HEAD:android)" = "$(git rev-parse "$PIN:android")"
          git rev-parse HEAD > "$RUNNER_TEMP/df-track04-android/QA_HEAD_SHA.txt"
          git rev-parse HEAD:android > "$RUNNER_TEMP/df-track04-android/APP_TREE_SHA.txt"
          node --check tests/android_e2e_recovery/cdp_actions.cjs
          node --test tests/android_e2e_recovery/cdp_debug_gate.test.cjs tests/android_e2e_recovery/cdp_protocol.test.cjs tests/android_e2e_recovery/cdp_touch_target.test.cjs
          bash -n tests/android_e2e_recovery/track04_one_shot_android.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API36 build tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build disposable debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Ensure KVM available
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          sudo chmod u+rw /dev/kvm
      - name: Real API30 emulator and WebView interactions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          disable-animations: true
          script: bash tests/android_e2e_recovery/track04_one_shot_android.sh
      - name: Record strict platform/test gaps
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/df-track04-android"
          printf '%s\n' 'Device emulator Android API30, not physical handset. Additional 13 CDP cases, other controls, native all-language Dialog, real SAF and TalkBack NOT_TESTED unless individually proven. No main merge. RELEASE_APPROVED=NO.' > "$RUNNER_TEMP/df-track04-android/README-LIMITS.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DF-TRACK04-ANDROID-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: ${{ runner.temp }}/df-track04-android/
