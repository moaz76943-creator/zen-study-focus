name: Deep Focus 2026 Consolidated Recovery QA
on:
  push:
    branches: [integration/deep-focus-consolidated-repair-20261020, fix/master-completion-20261020, fix/df4-activity-counters-durability-20261020, fix/df4-language-switch-durability-20261020, integration/deep-focus-stability-20261020, fix/df4-android-touch-evidence-20261020, fix/df4-notes-save-visible-android-20261020, integration/deep-focus-consolidated-candidate-20261020, review/track06-gated-checkpoint-20261020, review/track07-09-staged-functional-20261020]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deep-focus-rescue-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record exact source and check sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/df-2026-evidence"
          git rev-parse HEAD | tee "$RUNNER_TEMP/df-2026-evidence/head-sha.txt"
          for file in android/app/src/main/assets/web/*.js docs/control-center/*.js tools/quality_center/*.cjs; do
            node --check "$file"
          done
          node tests/validate_locales.cjs
          node tests/smoke_app.cjs
          node tools/control_center/generate_style.cjs --check
      - name: Full Node and Python source regressions (excluding deliberate release blocker)
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t suites < <(find tests -type f \( -name '*.test.cjs' -o -name 'test_*.cjs' \) ! -name media_provenance_gate.test.cjs | sort)
          test "${#suites[@]}" -gt 0
          node --test --test-reporter=tap "${suites[@]}" | tee "$RUNNER_TEMP/df-2026-evidence/node.tap"
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/df-2026-evidence/python.log"
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/android_e2e_recovery -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/df-2026-evidence/android-harness-unit.log"
      - name: Explicit missing-media provenance release gate
        id: media
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --test tests/master_recovery_qa/media_provenance_gate.test.cjs 2>&1 | tee "$RUNNER_TEMP/df-2026-evidence/media-gate.tap"
      - name: Read-only quality report and audit
        shell: bash
        run: |
          set +e
          node tools/quality_center/run.cjs --out "$RUNNER_TEMP/df-2026-evidence/quality"
          echo "QUALITY_EXIT_CODE=$?" >> "$GITHUB_ENV"
          set -e
          node tools/control_center/audit.cjs --json "$RUNNER_TEMP/df-2026-evidence/control-health.json" --markdown "$RUNNER_TEMP/df-2026-evidence/control-health.md"
          if command -v ffprobe >/dev/null && command -v ffmpeg >/dev/null; then
            python3 tools/recovery/media_inventory.py --out "$RUNNER_TEMP/df-2026-evidence/bundled-media-inventory.json"
          else
            printf '%s\n' '{"status":"NOT_TESTED","reason":"ffprobe/ffmpeg unavailable","release_approved":false}' > "$RUNNER_TEMP/df-2026-evidence/bundled-media-inventory.json"
          fi
          node tests/audio_acquisition_12/audit_candidates.cjs > "$RUNNER_TEMP/df-2026-evidence/audio-candidate-audit.json" || true
          printf 'Android physical acceptance: NOT_TESTED\nCommercial nature-recording clearance: BLOCKED\nPlay/release approval: BLOCKED\n' > "$RUNNER_TEMP/df-2026-evidence/RELEASE_NOT_APPROVED.txt"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify native repeated-completion policy
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/native-ledger"
          javac -d "$RUNNER_TEMP/native-ledger" android/app/src/main/java/com/zenstudy/focus/NativeCompletionLedger.java tests/timer_native_bridge/NativeCompletionLedgerTest.java
          java -cp "$RUNNER_TEMP/native-ledger" com.zenstudy.focus.NativeCompletionLedgerTest
          javac -d "$RUNNER_TEMP/native-ledger" android/app/src/main/java/com/zenstudy/focus/NativeDocumentWriter.java tests/timer_native_bridge/NativeDocumentWriterTest.java
          java -cp "$RUNNER_TEMP/native-ledger" com.zenstudy.focus.NativeDocumentWriterTest
      - name: Install Android API 36
        shell: bash
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile unsigned Android test APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Hash exact APK (testing only)
        shell: bash
        run: |
          sha256sum android/app/build/outputs/apk/debug/*.apk | tee "$RUNNER_TEMP/df-2026-evidence/apk.sha256"
          echo "### SOURCE BUILD ONLY · MEDIA/DEVICE/RELEASE BLOCKED" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve SHA, testing evidence, and debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DeepFocus-2026-Rescue-Debug-APK-and-QA
          retention-days: 7
          if-no-files-found: warn
          path: |
            android/app/build/outputs/apk/debug/*.apk
            ${{ runner.temp }}/df-2026-evidence/
