name: DF4 Android disposable E2E
on:
  push:
    branches:
      - qa/df4-android-e2e-20261019
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: df4-android-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-black-box:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact QA SHA
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Source-level E2E harness tests (NOT Android PASS)
        run: |
          node --test tests/android_e2e_recovery/inventory.test.cjs
          python3 -m unittest discover -s tests/android_e2e_recovery -p 'test_*.py' -v
      - name: Build disposable Debug APK at exact SHA
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Enable hardware acceleration on ephemeral hosted runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android UIAutomator cases on fresh emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -eu
            test -s android/app/build/outputs/apk/debug/app-debug.apk
            adb -s emulator-5554 get-state
            adb -s emulator-5554 install -r android/app/build/outputs/apk/debug/app-debug.apk
            # Explicit positive-permission case: prevent first-launch Android permission modal
            # from hiding WebView controls; denial behavior remains a separate NOT_TESTED case.
            adb -s emulator-5554 shell pm grant com.zenstudy.focus android.permission.POST_NOTIFICATIONS
            adb -s emulator-5554 shell am start -n com.zenstudy.focus/.MainActivity
            sleep 3
            adb -s emulator-5554 shell uiautomator dump /sdcard/df4-preflight.xml
            adb -s emulator-5554 exec-out cat /sdcard/df4-preflight.xml > tests/android_e2e_recovery/preflight_ui.xml
            # Emulator is newly provisioned; never connect to the owner's phone/profile.
            python3 tests/android_e2e_recovery/run_e2e.py --serial emulator-5554 --ack-disposable-data --json tests/android_e2e_recovery/results.local.json
      - name: Upload exact-result Android QA JSON (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DF4-Android-E2E-Results-${{ github.sha }}
          if-no-files-found: warn
          path: |
            tests/android_e2e_recovery/results.local.json
            tests/android_e2e_recovery/preflight_ui.xml
