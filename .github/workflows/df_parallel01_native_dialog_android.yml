name: DF Parallel01 native dialog Android device QA (non-release)
on:
  push:
    branches: [fix/df-parallel01-native-dialogs-current-20261026]
  pull_request:
    branches: [integration/master-qa-verified-v21]
    paths:
      - 'android/app/src/main/java/com/zenstudy/focus/**'
      - 'tests/android_dialogs/**'
      - 'tests/critical_room7/n02_contract.test.cjs'
      - 'tests/critical_room7/n03_contract.test.cjs'
      - 'tests/critical_room7/n04_contract.test.cjs'
      - 'tools/critical_room7/android_e2e_sha_guard.mjs'
      - '.github/workflows/df_parallel01_native_dialog_android.yml'
permissions:
  contents: read
jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Checkout pinned existing test-only accessibility probe
        uses: actions/checkout@v4
        with:
          ref: f20e3056c6c5e367b393331033967c7cf99e5412
          path: qa-probe
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Native lifecycle and APK guard regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/critical_room7/n04_contract.test.cjs
          for contract in tests/critical_room7/n02_contract.test.cjs tests/critical_room7/n03_contract.test.cjs; do
            if [[ -f "$contract" ]]; then node --test "$contract"; fi
          done
      - name: Verify exact source and source-only contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha || github.sha }}'
          node --test tests/android_dialogs/current_native_dialog_handoff.test.cjs
          node --check tests/android_dialogs/native_js_dialog_android_probe.cjs
          bash -n tests/android_dialogs/run_native_dialog_device.sh
      - name: Enable CDP for disposable DEBUG APK in runner workspace ONLY
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/java/com/zenstudy/focus/MainActivity.java')
          src=p.read_text()
          needle='WebView.setWebContentsDebuggingEnabled(false);'
          assert src.count(needle)==1, 'Current app must fail-closed in production'
          src=src.replace(needle,'WebView.setWebContentsDebuggingEnabled((getApplicationInfo().flags & android.content.pm.ApplicationInfo.FLAG_DEBUGGABLE) != 0);')
          p.write_text(src)
          PY
          test "$(git diff --name-only)" = 'android/app/src/main/java/com/zenstudy/focus/MainActivity.java'
          ! grep -Fq 'setAllowContentAccess(true)' android/app/src/main/java/com/zenstudy/focus/MainActivity.java
      - name: Compile debug-only emulator artifact (never publish or sign release)
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
          gradle -p android :app:assembleDebug --no-daemon
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          gradle -p qa-probe/tools/i18n/e2e/probe assembleDebug --no-daemon
          test -s qa-probe/tools/i18n/e2e/probe/build/outputs/apk/debug/*-debug.apk
          mkdir -p "$RUNNER_TEMP/df-dialog-evidence"
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/df-dialog-evidence/apk.sha256"
          git rev-parse HEAD > "$RUNNER_TEMP/df-dialog-evidence/source-head.txt"
          node tools/critical_room7/android_e2e_sha_guard.mjs \
            --bundle-dir "$RUNNER_TEMP/df-dialog-evidence" \
            --base-dir "$PWD" \
            --source-name source-head.txt \
            --expected-source-sha "$(git rev-parse HEAD)" --json \
            > "$RUNNER_TEMP/df-dialog-evidence/apk-source-verification.json"
      - name: Give emulator runner KVM access
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          sudo chmod u+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Real on-device Dialog Cancel Back Confirm Alert Prompt API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: ${{ matrix.api == 30 && '2048M' || '3072M' }}
          heap-size: ${{ matrix.api == 30 && '256M' || '512M' }}
          emulator-boot-timeout: 900
          disable-animations: false
          script: bash tests/android_dialogs/run_native_dialog_device.sh
      - name: Keep evidence without claiming release approval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: df-parallel01-native-dialog-api-${{ matrix.api }}-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/df-dialog-evidence/*.json
            ${{ runner.temp }}/df-dialog-evidence/*.xml
            ${{ runner.temp }}/df-dialog-evidence/*.png
            ${{ runner.temp }}/df-dialog-evidence/*.txt
            ${{ runner.temp }}/df-dialog-evidence/*.sha256
