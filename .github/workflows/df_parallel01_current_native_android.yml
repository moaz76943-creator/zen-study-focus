name: DF Parallel01 current-head real Android ACK/SAF QA
on:
  pull_request:
    branches: [integration/master-qa-verified-v21]
    paths:
      - 'android/app/src/main/java/com/zenstudy/focus/MainActivity.java'
      - 'android/app/src/main/assets/web/app.js'
      - 'android/app/src/main/assets/web/preflight_v22.js'
      - 'android/app/src/main/assets/web/integration_v22.js'
      - 'tests/android_e2e_recovery/p0_timer_saf_android.cjs'
      - 'tests/android_e2e_recovery/p0_timer_saf_ci.sh'
      - 'tests/android_e2e_recovery/picker_transport.test.cjs'
      - 'tests/android_e2e_recovery/native_ui_dump.py'
      - 'tests/android_e2e_recovery/native_faults.cjs'
      - 'tests/android_e2e_recovery/native_faults.test.cjs'
      - 'tests/android_e2e_recovery/prepare_native_probe*.py'
      - '.github/workflows/df_parallel01_current_native_android.yml'
permissions:
  contents: read
concurrency:
  group: df-parallel01-current-native-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  android-device:
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Checkout pinned test-only native accessibility probe
        uses: actions/checkout@v4
        with:
          ref: f20e3056c6c5e367b393331033967c7cf99e5412
          path: qa-probe
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Assert exact PR head and build source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          node --check tests/android_e2e_recovery/p0_timer_saf_android.cjs
          node --test tests/android_e2e_recovery/picker_transport.test.cjs tests/android_e2e_recovery/native_faults.test.cjs
          node --test tests/integration_recovery/native_saf_import_forwardport.test.cjs
          python3 tests/android_e2e_recovery/prepare_native_probe_test.py
      - name: Ensure Android compile SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Enable DevTools only for disposable debug QA APK
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('android/app/src/main/java/com/zenstudy/focus/MainActivity.java')
          source=path.read_text()
          old='WebView.setWebContentsDebuggingEnabled(false);'
          assert source.count(old)==1, 'Debug flag shape unexpectedly changed; do not mutate the release source'
          source=source.replace(old,'WebView.setWebContentsDebuggingEnabled((getApplicationInfo().flags & android.content.pm.ApplicationInfo.FLAG_DEBUGGABLE) != 0);')
          path.write_text(source)
          PY
          test "$(git diff --name-only)" = 'android/app/src/main/java/com/zenstudy/focus/MainActivity.java'
      - name: Compile disposable non-release APK
        run: gradle -p android :app:assembleDebug --no-daemon
      - name: Compile separate test-only accessibility APK
        run: |
          python3 tests/android_e2e_recovery/prepare_native_probe.py \
            qa-probe/tools/i18n/e2e/probe/src/main/java/com/zenstudy/focus/e2e/AccessibilityProbe.java \
            android/app/src/main/res/values/strings.xml
          gradle -p qa-probe/tools/i18n/e2e/probe assembleDebug --no-daemon
          mkdir -p "$RUNNER_TEMP/df-pr01-android"
          git -C qa-probe rev-parse HEAD > "$RUNNER_TEMP/df-pr01-android/probe-source-sha.txt"
          sha256sum qa-probe/tools/i18n/e2e/probe/src/main/java/com/zenstudy/focus/e2e/AccessibilityProbe.java > "$RUNNER_TEMP/df-pr01-android/probe-source.sha256"
          sha256sum qa-probe/tools/i18n/e2e/probe/build/outputs/apk/debug/*.apk > "$RUNNER_TEMP/df-pr01-android/probe-apk.sha256"
      - name: Capture exact SHA and prepare emulator
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/df-pr01-android"
          git rev-parse HEAD HEAD:android > "$RUNNER_TEMP/df-pr01-android/source-shas.txt"
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/df-pr01-android/built-apk.sha256"
          test -c /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          sudo chmod u+rw /dev/kvm
      - name: Execute real DocumentsUI, native ACK and force-stop probes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          heap-size: 256M
          emulator-boot-timeout: 900
          # Android emulator ADB may not accept animation settings immediately after boot;
          # don't abort the real device test before our own readiness checks.
          disable-animations: false
          script: bash tests/android_e2e_recovery/p0_timer_saf_ci.sh
      - name: Preserve real PASS FAIL NOT_TESTED results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DF-Parallel01-current-Android-${{ matrix.api-level }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/df-pr01-android/
          retention-days: 7
          if-no-files-found: warn
