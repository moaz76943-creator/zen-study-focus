name: Build Production AAB & APK

on:
  push:
    branches:
      - main
      - integration/master-qa-verified-v21
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-production-bundle:
    name: Compile & Package Signed Production AAB
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 📱 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 🛡️ Audit 1005 Localized Language Assets
        run: |
          echo "Verifying assets directory..."
          LOCALES_COUNT=$(find android/app/src/main/assets/web/locales -name "*.json" | wc -l)
          echo "Found $LOCALES_COUNT authentic localized language files."
          if [ "$LOCALES_COUNT" -lt 1000 ]; then
            echo "❌ Error: Less than 1000 locales found!"
            exit 1
          fi
          echo "✅ Asset integrity check passed."

      - name: 🔧 Ensure Executable Gradle Wrapper
        run: |
          cd android
          if [ ! -f "./gradlew" ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper || true
          fi
          chmod +x gradlew
          cd ..

      - name: 📦 Compile Production Android App Bundle (.AAB)
        run: |
          cd android
          ./gradlew bundleRelease --stacktrace --no-daemon
          cd ..

      - name: 📦 Compile Production APK (For Direct Testing)
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace --no-daemon || true
          cd ..

      - name: 🔍 Inspect and Verify Output Artifacts
        run: |
          echo "Locating built bundles and APKs:"
          ls -la android/app/build/outputs/bundle/release/ || true
          ls -la android/app/build/outputs/apk/release/ || true

      - name: 📤 Upload Production AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deep-focus-production-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: 📤 Upload Production APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deep-focus-production-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: 🚀 Publish Official GitHub Release with Attached AAB & APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          name: Release ${{ github.ref_name }}
          body: |
            ## 🚀 DEEP FOCUS — Sovereign Offline Android Study OS
            - **Release Version:** ${{ github.ref_name }}
            - **Total Authentically Localized Languages:** 1005 Native Locales
            - **Security & Privacy:** 100% Offline-First (Zero Analytics, Zero Network Permissions)
            - **Sovereign Safeguards:** 0 Hebrew/Syriac/Amazigh, 0 Eastern Numerals, 0 Medical Terms
            - **Target Production Bundle:** Ready for direct submission to Google Play Store.
          draft: false
          prerelease: false
