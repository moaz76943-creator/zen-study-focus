name: Build Production AAB & APK

on:
  push:
    branches:
      - main
      - integration/master-qa-verified-v21
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-production-bundle:
    name: Compile & Sign Production Android App
    runs-on: ubuntu-24.04

    steps:
      - name: 📥 Checkout Repository Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Set up Node.js & Run Sovereign E2E Tests
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🧪 Execute Sovereign E2E Integration Gate
        run: |
          node --check android/app/src/main/assets/web/app.js
          if [ -f "tests/sovereign_e2e_test.js" ]; then
            node tests/sovereign_e2e_test.js
          fi

      - name: ☕ Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐘 Set up Standalone Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      - name: 📱 Configure Android SDK 35 & Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK_DIR" ] && [ -d "/usr/local/lib/android/sdk" ]; then
            SDK_DIR="/usr/local/lib/android/sdk"
          fi
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV
          SDKMANAGER=$(find "$SDK_DIR" -name sdkmanager 2>/dev/null | head -n 1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platforms;android-35" "build-tools;35.0.0" "platform-tools" || true
          yes | "$SDKMANAGER" --licenses || true

      - name: 🧹 Sanitize Gradle Environment
        run: |
          rm -f android/local.properties
          sed -i 's/\r$//' android/gradlew 2>/dev/null || true
          chmod +x android/gradlew 2>/dev/null || true

      - name: 🔑 Ensure Production Keystore
        run: |
          cd android/app
          if [ ! -f "zenfocus2026.jks" ]; then
            keytool -genkeypair -v -keystore zenfocus2026.jks -alias zenfocus2026 -keyalg RSA -keysize 2048 -validity 10000 -storepass zenfocus2026 -keypass zenfocus2026 -dname "CN=DeepFocus, OU=StudyOS, O=Sovereign, L=Global, ST=None, C=US"
          fi
          cd ../..

      - name: 📦 Compile Production Android App Bundle (.AAB)
        run: |
          set -o pipefail
          cd android
          if [ -f "./gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            ./gradlew bundleRelease --stacktrace --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m" 2>&1 | tee gradle_build.log
          else
            echo "Wrapper jar absent; using Standalone Gradle 8.11.1..."
            gradle bundleRelease --stacktrace --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m" 2>&1 | tee gradle_build.log
          fi
          cd ..

      - name: 🔍 Upload Gradle Failure Log (If Build Failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-failure-log
          path: android/gradle_build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: 📦 Compile Production APK (For Direct Device Install)
        run: |
          cd android
          if [ -f "./gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            ./gradlew assembleRelease --stacktrace --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m" || true
          else
            gradle assembleRelease --stacktrace --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m" || true
          fi
          cd ..

      - name: 📤 Upload Production AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deep-focus-production-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: 📤 Upload Production APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deep-focus-production-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: 🚀 Publish Official GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          name: Release ${{ github.ref_name }}
          body: |
            ## DEEP FOCUS Sovereign Study OS
            - Release Tag: ${{ github.ref_name }}
            - 100% Offline-First (Zero PII, Pure Web Audio DSP, Zero Music)
          draft: false
          prerelease: false
