name: DF ROOM04 actual CSV DocumentsUI
on:
  pull_request:
    branches: [integration/master-qa-verified-v21]
    paths:
      - 'tests/analytics_csv/**'
      - '.github/workflows/df_room04_csv.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: df-room04-csv-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-android:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        api: [30, 35]
    env:
      DF09_ANDROID_API: ${{ matrix.api }}
      DF09_NATIVE_EVIDENCE: /tmp/df09-android-api${{ matrix.api }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Validate test-only code
        run: |
          node --check tests/analytics_csv/real_android_saf.cjs
          bash -n tests/analytics_csv/run_android.sh
          node --test tests/analytics_csv/*.test.cjs tests/analytics_core/*.test.cjs
          mkdir -p /tmp/df-csv-java
          javac -d /tmp/df-csv-java android/app/src/main/java/com/zenstudy/focus/NativeCsvWriter.java tests/analytics_csv/NativeCsvWriterTest.java
          java -cp /tmp/df-csv-java com.zenstudy.focus.NativeCsvWriterTest
      - name: Ephemeral QA debug WebView, never committed to Native
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          g=Path('android/app/build.gradle')
          s=g.read_text(); anchor='    buildTypes {\n'
          assert s.count(anchor)==1
          g.write_text(s.replace(anchor,anchor+"        debug {\n            applicationIdSuffix '.qa'\n            versionNameSuffix '-df09'\n        }\n"))
          j=Path('android/app/src/main/java/com/zenstudy/focus/MainActivity.java')
          s=j.read_text()
          assert s.count('WebView.setWebContentsDebuggingEnabled(false);')==1
          s=s.replace('WebView.setWebContentsDebuggingEnabled(false);','WebView.setWebContentsDebuggingEnabled(true);')
          old='if (!"com.zenstudy.focus".equals(getPackageName())) {'
          assert s.count(old)==1
          j.write_text(s.replace(old,'if (!"com.zenstudy.focus".equals(getPackageName()) && !"com.zenstudy.focus.qa".equals(getPackageName())) {'))
          m=Path('android/app/src/main/AndroidManifest.xml')
          s=m.read_text()
          assert s.count('android:label="Deep Focus"')==1
          m.write_text(s.replace('android:label="Deep Focus"','android:label="Deep Focus QA DF09"'))
          PY
          diff="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' android/app/build.gradle android/app/src/main/AndroidManifest.xml android/app/src/main/java/com/zenstudy/focus/MainActivity.java | sort)"
          test "$diff" = "$expected"
          test -z "$(git diff --name-only -- android/app/src/main/assets/web)"
          mkdir -p "$DF09_NATIVE_EVIDENCE"
          git rev-parse HEAD > "$DF09_NATIVE_EVIDENCE/SOURCE_SHA.txt"
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha || github.sha }}' 
          git diff > "$DF09_NATIVE_EVIDENCE/EPHEMERAL_INSTRUMENTATION.diff"
          printf '%s\n' 'QA-only package. Real native DocumentsUI Cancel and Save; independent byte comparison required. TalkBack NOT_TESTED. RELEASE_APPROVED=NO.' > "$DF09_NATIVE_EVIDENCE/LIMITS.txt"
      - name: Build isolated QA Android APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Verify APK ID and hash
        shell: bash
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/debug/app-debug.apk "$DF09_NATIVE_EVIDENCE/DeepFocus-DF09-QA-only.apk"
          sha256sum "$DF09_NATIVE_EVIDENCE/DeepFocus-DF09-QA-only.apk" > "$DF09_NATIVE_EVIDENCE/APK_SHA256.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$DF09_NATIVE_EVIDENCE/DeepFocus-DF09-QA-only.apk" > "$DF09_NATIVE_EVIDENCE/APK_BADGING.txt"
          grep -F "package: name='com.zenstudy.focus.qa'" "$DF09_NATIVE_EVIDENCE/APK_BADGING.txt"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$DF09_NATIVE_EVIDENCE/DeepFocus-DF09-QA-only.apk"
      - name: Enable KVM
        run: |
          test -c /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          sudo chmod u+rw /dev/kvm
      - name: Real Android WebView API matrix
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          ram-size: '2048M'
          heap-size: '256M'
          disable-animations: false
          script: bash tests/analytics_csv/run_android.sh
      - name: Preserve evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DF-ROOM04-CSV-API${{ matrix.api }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/df09-android-api${{ matrix.api }}/
          retention-days: 7
