name: Legacy PR160 Task Note IDs QA
on:
  push:
    branches:
      - fix/legacy-pr160-unchanged-noteids-20261026
      - integration/master-qa-verified-v21
    paths:
      - android/app/src/main/assets/web/tasks_studio.js
      - tests/tasks_core/tasks_studio.test.cjs
      - .github/workflows/legacy_pr160_noteids.yml
  pull_request:
    paths:
      - android/app/src/main/assets/web/tasks_studio.js
      - tests/tasks_core/tasks_studio.test.cjs
      - .github/workflows/legacy_pr160_noteids.yml
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  task-legacy-noteids:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: git rev-parse HEAD
      - run: node --check android/app/src/main/assets/web/tasks_studio.js
      - run: node --test tests/tasks_core/tasks_studio.test.cjs tests/tasks_core/tasks_core.test.cjs
