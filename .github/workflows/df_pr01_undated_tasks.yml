name: DF-PR-01 legacy v21 undated tasks semantics
on:
  push:
    branches: [fix/df-pr01-legacy-undated-tasks-20261026]
  pull_request:
    branches: [integration/master-qa-verified-v21]
    paths:
      - 'android/app/src/main/assets/web/tasks_core_v21.js'
      - 'android/app/src/main/assets/web/tasks_studio.js'
      - 'tests/tasks_core/df_pr01_undated_contract.test.cjs'
      - 'tests/tasks_core/tasks_core.test.cjs'
      - 'tests/tasks_core/tasks_studio.test.cjs'
      - '.github/workflows/df_pr01_undated_tasks.yml'
permissions:
  contents: read
jobs:
  v21-task-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert JavaScript syntax
        run: |
          node --check android/app/src/main/assets/web/tasks_core_v21.js
          node --check android/app/src/main/assets/web/tasks_studio.js
      - name: Execute existing task logic and newly recovered legacy due-state invariants
        run: node --test tests/tasks_core/df_pr01_undated_contract.test.cjs tests/tasks_core/tasks_core.test.cjs tests/tasks_core/tasks_studio.test.cjs
