name: Deep Focus Track 13 Exact-SHA Security
on:
  push:
    branches:
      - audit/track13-security-exact-sha-20261021
      - integration/master-recovery-20261021
  pull_request:
    branches:
      - integration/master-recovery-20261021
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: track13-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gitleaks:
    name: Gitleaks tree + history (redacted, fail closed)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "SECURITY_SOURCE_SHA=$EXPECTED_SHA"
      - name: Privacy-preserving report regression tests
        run: node --test tests/security_recovery/track13_secret_report.test.cjs
      - name: Obtain pinned and verified scanner
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$RUNNER_TEMP/gitleaks.tgz"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"$RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks"
      - name: Verify narrow allowlists still detect a synthetic unknown credential
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          probe="$(mktemp -d "$RUNNER_TEMP/df-track13-probe.XXXXXX")"
          trap 'rm -rf "$probe"' EXIT
          python3 - "$probe" <<'PY'
          import pathlib, sys
          from secrets import token_urlsafe
          (pathlib.Path(sys.argv[1]) / 'synthetic.env').write_text(
              'service_secret = "' + token_urlsafe(48) + '"\n', encoding='utf-8')
          PY
          set +e
          "$RUNNER_TEMP/gitleaks" dir --no-banner --config "$PWD/.gitleaks.toml" --redact --log-level error --report-format json --report-path "$probe/result.json" "$probe" >/dev/null 2>&1
          scan_status=$?
          set -e
          # A scanner error may also exit 1. Only an actual valid finding proves detection.
          if [[ "$scan_status" -ne 1 || ! -s "$probe/result.json" ]]; then
            echo 'SYNTHETIC_PROBE_BLOCKED'
            exit 1
          fi
          python3 - "$probe/result.json" <<'PY'
          import json, sys
          try:
              with open(sys.argv[1], encoding='utf-8') as reader:
                  findings = json.load(reader)
              if not isinstance(findings, list) or not any(
                  isinstance(row, dict) and row.get('RuleID') == 'generic-api-key'
                  for row in findings
              ):
                  raise ValueError('missing expected rule')
          except (OSError, ValueError, UnicodeError):
              print('SYNTHETIC_PROBE_BLOCKED')
              raise SystemExit(1)
          print('SYNTHETIC_DETECTION_PASS')
          PY
      - name: Scan current tree AND git history without revealing secrets
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          work="$(mktemp -d "$RUNNER_TEMP/df-track13.XXXXXX")"
          trap 'rm -rf "$work"' EXIT
          set +e
          "$RUNNER_TEMP/gitleaks" dir --no-banner --config "$PWD/.gitleaks.toml" --redact --log-level error --report-format json --report-path "$work/tree.json" . >/dev/null 2>&1
          tree_exit=$?
          "$RUNNER_TEMP/gitleaks" git --no-banner --config "$PWD/.gitleaks.toml" --redact --log-level error --report-format json --report-path "$work/history.json" . >/dev/null 2>&1
          history_exit=$?
          python3 tools/security/track13_gitleaks_report.py --report "$work/tree.json" --sha "$(git rev-parse HEAD)" --scan-exit "$tree_exit" > "$work/tree-summary.json"
          tree_report_exit=$?
          python3 tools/security/track13_gitleaks_report.py --report "$work/history.json" --sha "$(git rev-parse HEAD)" --scan-exit "$history_exit" > "$work/history-summary.json"
          history_report_exit=$?
          set -e
          echo 'Tree scan redacted metadata:'
          cat "$work/tree-summary.json"
          echo 'History scan redacted metadata:'
          cat "$work/history-summary.json"
          {
            echo '### Track 13 Gitleaks (exact source SHA)'
            echo 'Only redacted rule IDs, file-path hashes and line numbers are emitted. No raw findings are uploaded.'
            echo 'Tree:'
            cat "$work/tree-summary.json"
            echo 'History:'
            cat "$work/history-summary.json"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$tree_report_exit" != 0 || "$history_report_exit" != 0 ]]; then exit 1; fi
  codeql:
    name: CodeQL JavaScript security-extended (exact SHA)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "SECURITY_SOURCE_SHA=$EXPECTED_SHA"
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
        with:
          category: /language:javascript-typescript
