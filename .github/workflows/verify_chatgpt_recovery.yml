name: Recovery ChatGPT focused regression checks

on:
  pull_request:
    branches:
      - integration/deep-focus-recovery-00-final-20261019
      - fix/df-chatgpt-offline-fonts-20261019
    paths:
      - 'android/app/src/main/assets/web/**'
      - 'tests/integration_recovery/**'
      - 'tests/analytics_recovery/**'
      - 'tests/completion_alerts/**'
      - 'tests/tasks_recovery/**'
      - '.github/workflows/verify_chatgpt_recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify modified JS syntax
        run: |
          node --check android/app/src/main/assets/web/analytics_recovery_ar_locale.js
          node --check android/app/src/main/assets/web/analytics_recovery_ui.js
          node --check android/app/src/main/assets/web/completion_alert_locales.js
          node --check android/app/src/main/assets/web/integration_v22.js
          node --check tests/integration_recovery/offline_typography.test.cjs
          node --check tests/analytics_recovery/analytics_ar.test.cjs
          node --check tests/completion_alerts/picker_locales.test.cjs
          node --check tests/completion_alerts/mobile_picker.test.cjs
          node --check tests/tasks_recovery/mobile_density.test.cjs
          node --check android/app/src/main/assets/web/tasks_studio.js
          node --check android/app/src/main/assets/web/completion_alert_settings.js
      - name: Focused recovery regressions and existing contracts
        run: |
          node --test tests/integration_recovery/*.test.cjs
          node --test tests/analytics_recovery/*.test.cjs
          node --test tests/completion_alerts/*.test.cjs
          node --test tests/tasks_recovery/*.test.cjs
          node --test tests/localization_20/*.test.cjs
          node --test tests/master_recovery_qa/source_contracts.test.cjs

  integrated-build:
    needs: focused
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android API 36 and build tools
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Existing smoke and locale checks
        run: |
          node tests/validate_locales.cjs
          node tests/smoke_app.cjs
          for file in android/app/src/main/assets/web/*.js; do node --check "$file"; done
      - name: All existing JavaScript regression suites
        run: |
          node --test tests/data_contracts/*.test.cjs tests/notes_core/*.test.cjs tests/notes_ui/*.test.cjs tests/tasks_core/*.test.cjs tests/analytics_core/*.test.cjs tests/focus_workflows/*.test.cjs tests/design_quality/*.test.cjs tests/regression_v21/*.test.cjs tests/integration_quality/*.test.cjs
          node --test tests/recovery_baseline/*.test.cjs tests/ascii_numerals/*.test.cjs tests/localization_20/*.test.cjs tests/interaction_recovery/*.test.cjs tests/notes_recovery/*.test.cjs tests/tasks_recovery/*.test.cjs tests/analytics_recovery/*.test.cjs tests/white_premium_qa/*.test.cjs tests/completion_alerts/*.test.cjs tests/integration_recovery/*.test.cjs
          node --test tests/nature_audio_recovery/mixer.test.cjs tests/nature_audio_recovery/audit.test.cjs
          node --test tests/master_recovery_qa/source_contracts.test.cjs tests/master_recovery_qa/workflow.test.cjs
      - name: Python source safety regression checks
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Android debug APK and unsigned release AAB
        working-directory: android
        run: gradle assembleDebug bundleRelease --no-daemon
      - name: Upload test-only artifacts (never Play-signed)
        uses: actions/upload-artifact@v4
        with:
          name: DeepFocus-ChatGPT-Recovery-APK-and-AAB
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
