name: DF4 exact-head test APK
on:
  pull_request:
    branches: [integration/deep-focus-recovery-00-final-20261019, fix/df4-master-recovery-20261019]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: df4-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test-build:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'fix/df4-master-recovery-20261019' || github.head_ref == 'integration/df4-consolidated-qa-20261019'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record actual checked-out SHA
        run: |
          mkdir -p "$RUNNER_TEMP/df4-evidence"
          git rev-parse HEAD | tee "$RUNNER_TEMP/df4-evidence/commit-sha.txt"
      - name: Syntax, smoke, locales and regression suites
        run: |
          set -o pipefail
          for file in android/app/src/main/assets/web/*.js; do node --check "$file"; done
          node tests/validate_locales.cjs
          node tests/smoke_app.cjs
          mapfile -t suites < <(python3 -c 'from pathlib import Path; print("\n".join(str(p) for p in sorted(Path("tests").rglob("*.cjs")) if (p.name.endswith(".test.cjs") or p.name.startswith("test_")) and p.name != "media_provenance_gate.test.cjs"))')
          test "${#suites[@]}" -gt 0
          node --test --test-reporter=tap "${suites[@]}" | tee "$RUNNER_TEMP/df4-evidence/node.tap"
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/df4-evidence/python.log"
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/android_e2e_recovery -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/df4-evidence/android-runner-unit.log"
      - name: Current language and offline audits
        run: |
          node tools/language_review/audit.cjs --out "$RUNNER_TEMP/df4-evidence/localization"
          node tests/performance_recovery/asset_audit.cjs > "$RUNNER_TEMP/df4-evidence/offline-assets.json"
          node tests/android_e2e_recovery/inventory.cjs > "$RUNNER_TEMP/df4-evidence/control-inventory.json"
          node tools/control_center/audit.cjs --json "$RUNNER_TEMP/df4-evidence/control-health.json" --markdown "$RUNNER_TEMP/df4-evidence/control-health.md"
      - name: Unresolved media release gate (test APK is not release approval)
        id: media
        continue-on-error: true
        run: |
          set -o pipefail
          node --test --test-reporter=tap tests/master_recovery_qa/media_provenance_gate.test.cjs 2>&1 | tee "$RUNNER_TEMP/df4-evidence/media-release-gate.tap"
      - name: Explicit release status
        env:
          MEDIA_OUTCOME: ${{ steps.media.outcome }}
        run: |
          printf 'MEDIA_RELEASE_GATE=%s\nANDROID_DEVICE_TESTS=NOT_TESTED\nRELEASE_APPROVED=NO\n' "$MEDIA_OUTCOME" | tee "$RUNNER_TEMP/df4-evidence/release-status.txt"
          echo '### Test build only — production remains BLOCKED' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/df4-evidence/release-status.txt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android API 36
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK only
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: APK checksum
        run: sha256sum android/app/build/outputs/apk/debug/*.apk | tee "$RUNNER_TEMP/df4-evidence/apk-sha256.txt"
      - name: Upload test APK and exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DeepFocus-DF4-Test-APK-and-Evidence
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/*.apk
            ${{ runner.temp }}/df4-evidence/
  android-emulator:
    needs: test-build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: DeepFocus-DF4-Test-APK-and-Evidence
          path: ${{ runner.temp }}/df4-download
      - name: Locate exact-head debug APK
        run: |
          APK="$(find "$RUNNER_TEMP/df4-download" -name app-debug.apk -type f -print -quit)"
          test -s "$APK"
          cp "$APK" "$RUNNER_TEMP/df4-device-test.apk"
          mkdir -p "$RUNNER_TEMP/df4-android"
          git rev-parse HEAD > "$RUNNER_TEMP/df4-android/commit-sha.txt"
          sha256sum "$RUNNER_TEMP/df4-device-test.apk" > "$RUNNER_TEMP/df4-android/apk-sha256.txt"
      - name: Give this disposable runner access to hardware virtualization
        run: |
          test -c /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          sudo chmod u+rw /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - name: Actual fresh Android emulator scenarios
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          disable-animations: true
          script: bash tests/android_e2e_recovery/run_ci.sh
      - name: Preserve Android evidence including FAIL and NOT_TESTED
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DeepFocus-DF4-Android-Results
          path: ${{ runner.temp }}/df4-android/
          if-no-files-found: warn
