name: Build Sovereign Release AAB

on:
  push:
    branches:
      - integration/master-qa-verified-v21
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign Release AAB (v440.0.0)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Sovereign Keystore
        run: |
          echo "" | base64 -d > release.keystore
          echo "ZEN_UPLOAD_KEYSTORE_PATH=${GITHUB_WORKSPACE}/release.keystore" >> $GITHUB_ENV
          echo "ZEN_UPLOAD_STORE_PASSWORD=zenfocus2026" >> $GITHUB_ENV
          echo "ZEN_UPLOAD_KEY_ALIAS=deepfocus" >> $GITHUB_ENV
          echo "ZEN_UPLOAD_KEY_PASSWORD=zenfocus2026" >> $GITHUB_ENV

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Official Release AAB with ProGuard / R8
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload Official AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deep-focus-v440.0.0-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
