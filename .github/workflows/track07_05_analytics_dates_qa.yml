name: Track 07-05 analytics date QA
on:
  push:
    branches:
      - 'fix/track07-05-analytics-date-guard-20261020'
  pull_request:
    paths:
      - '.github/workflows/track07_05_analytics_dates_qa.yml'
      - 'tests/track07_functional/**'
      - 'android/app/src/main/assets/web/**'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run owned test suite
        run: node --test tests/track07_functional/analytics_date_guard.test.cjs tests/analytics_core/*.test.cjs tests/analytics_recovery/*.test.cjs
      - name: Check changed source syntax
        run: node --check android/app/src/main/assets/web/analytics_studio.js
