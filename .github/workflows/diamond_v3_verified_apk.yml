name: Diamond v3 APK build from verified v21 source
on:
  push:
    branches:
      - ci/diamond-v3-4b2c585-build

permissions:
  contents: read

jobs:
  build-verified-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SOURCE_BRANCH: integration/master-qa-verified-v21
      SOURCE_SHA: 4b2c58531d014b7983cbcf29cfaf5048c4a5cf7e
      SOURCE_TAG: v3.0.0-diamond-production-v21
    steps:
      - name: Checkout ONLY approved source branch
        uses: actions/checkout@v4
        with:
          ref: integration/master-qa-verified-v21
          fetch-depth: 0

      - name: Verify official source, tag, and Mission 175 before build
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --tags --prune
          git checkout "$SOURCE_BRANCH"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-list -n 1 "$SOURCE_TAG")" = "$SOURCE_SHA"
          git log -1 --format=%s | grep -F '[Mission 175]'
          test -f artifacts/evidence/cycle_175_receipt.json
          test -z "$(git status --porcelain)"
          echo "APPROVED_SOURCE_SHA=$SOURCE_SHA"
          echo "APPROVED_SOURCE_TAG=$SOURCE_TAG"
          echo "Mission 175 HEAD and tag verification: PASS"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android API 36 tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build installable Debug APK from exact approved source
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          if test -x ./gradlew; then
            ./gradlew assembleDebug --no-daemon
          else
            echo "No gradlew wrapper in approved source; using configured Gradle 8.11.1"
            gradle assembleDebug --no-daemon
          fi

      - name: Verify APK package, APK integrity and record SHA256
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" | tail -1
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -x "$AAPT"
          PKG="$("$AAPT" dump badging "$APK" | grep '^package:')"
          echo "$PKG"
          grep -F "name='com.zenstudy.focus'" <<< "$PKG"
          mkdir -p android/app/build/outputs/apk/debug
          {
            echo "source_branch=$SOURCE_BRANCH"
            echo "source_sha=$SOURCE_SHA"
            echo "source_tag=$SOURCE_TAG"
            echo "build_type=DEBUG (debug signed; not Play production signing)"
            echo "$PKG"
            sha256sum "$APK"
          } | tee android/app/build/outputs/apk/debug/PROVENANCE.txt

      - name: Upload APK and SHA256 provenance
        uses: actions/upload-artifact@v4
        with:
          name: DeepFocus-v3.0.0-diamond-verified-4b2c585-Debug-APK
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/debug/PROVENANCE.txt
          retention-days: 14
