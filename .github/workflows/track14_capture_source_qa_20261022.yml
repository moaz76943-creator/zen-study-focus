name: Track14 screenshot source-only guard QA
on:
  push:
    branches: [qa/track14-screenshot-guard-20261022]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: track14-capture-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PNG source guard and non-streaming install unit tests only
        run: node --test tests/white_premium_qa/track14_png_screen_guard.test.cjs tests/white_premium_qa/track14_android_install.test.cjs
      - name: Shell syntax check (no Android emulator, no APK build)
        run: bash -n tests/white_premium_qa/track14_android_snapshots.sh tests/white_premium_qa/track14_install_apk.sh
      - name: Scope declaration
        if: always()
        run: |
          echo "SOURCE_ONLY=YES"
          echo "ANDROID_EMULATOR=NOT_RUN"
          echo "WEBVIEW_RENDER=NOT_TESTED"
          echo "RELEASE_APPROVED=NO"
