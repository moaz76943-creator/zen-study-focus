name: Build Android Release Artifacts
on:
  push:
    branches: [ integration/master-qa-verified-v21, main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew 2>/dev/null || chmod +x android/gradlew 2>/dev/null || true

      - name: Build Android Release APK & AAB
        env:
          ZEN_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ZEN_UPLOAD_KEYSTORE_BASE64 }}
          ZEN_UPLOAD_STORE_PASSWORD: ${{ secrets.ZEN_UPLOAD_STORE_PASSWORD }}
          ZEN_UPLOAD_KEY_ALIAS: ${{ secrets.ZEN_UPLOAD_KEY_ALIAS }}
          ZEN_UPLOAD_KEY_PASSWORD: ${{ secrets.ZEN_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "$ZEN_UPLOAD_KEYSTORE_BASE64" ] && [ -n "$ZEN_UPLOAD_STORE_PASSWORD" ] && [ -n "$ZEN_UPLOAD_KEY_ALIAS" ] && [ -n "$ZEN_UPLOAD_KEY_PASSWORD" ]; then
            echo "$ZEN_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
            export ZEN_UPLOAD_KEYSTORE_PATH="$RUNNER_TEMP/upload-keystore.jks"
            echo "Signing keystore configured; building signed release artifacts."
          else
            echo "Signing keystore secrets absent; falling back to unsigned assembleRelease / bundleRelease build."
            unset ZEN_UPLOAD_KEYSTORE_PATH ZEN_UPLOAD_STORE_PASSWORD ZEN_UPLOAD_KEY_ALIAS ZEN_UPLOAD_KEY_PASSWORD
          fi
          if [ -x "./gradlew" ]; then
            ./gradlew -p android assembleRelease bundleRelease
          elif [ -x "android/gradlew" ]; then
            ./android/gradlew -p android assembleRelease bundleRelease
          else
            gradle -p android assembleRelease bundleRelease
          fi

      - name: Upload APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deep-focus-release-build
          if-no-files-found: error
          path: |
            **/build/outputs/apk/release/*.apk
            **/build/outputs/bundle/release/*.aab
