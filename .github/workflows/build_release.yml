name: Build Android Release Artifacts
on:
  push:
    branches: [ integration/master-qa-verified-v21, main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew 2>/dev/null || chmod +x android/gradlew 2>/dev/null || true

      - name: Build Android Release APK & AAB
        run: |
          GW="./gradlew"
          [ -f "$GW" ] || GW="android/gradlew"
          "$GW" assembleRelease || true
          "$GW" bundleRelease || true

      - name: Upload APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deep-focus-release-build
          path: |
            **/build/outputs/apk/release/*.apk
            **/build/outputs/bundle/release/*.aab
