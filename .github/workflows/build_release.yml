name: Build Android Release Artifacts
on:
  push:
    branches: [ integration/master-qa-verified-v21, main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew 2>/dev/null || chmod +x android/gradlew 2>/dev/null || true

      - name: Clean & Build Android Release APK & AAB
        env:
          ZEN_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ZEN_UPLOAD_KEYSTORE_BASE64 }}
          ZEN_UPLOAD_STORE_PASSWORD: ${{ secrets.ZEN_UPLOAD_STORE_PASSWORD }}
          ZEN_UPLOAD_KEY_ALIAS: ${{ secrets.ZEN_UPLOAD_KEY_ALIAS }}
          ZEN_UPLOAD_KEY_PASSWORD: ${{ secrets.ZEN_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "$ZEN_UPLOAD_KEYSTORE_BASE64" ] && [ -n "$ZEN_UPLOAD_STORE_PASSWORD" ] && [ -n "$ZEN_UPLOAD_KEY_ALIAS" ] && [ -n "$ZEN_UPLOAD_KEY_PASSWORD" ]; then
            echo "$ZEN_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
            export ZEN_UPLOAD_KEYSTORE_PATH="$RUNNER_TEMP/upload-keystore.jks"
            echo "Signing keystore configured; building signed release artifacts."
          else
            echo "Signing keystore secrets absent; falling back to unsigned assembleRelease / bundleRelease build."
            unset ZEN_UPLOAD_KEYSTORE_PATH ZEN_UPLOAD_STORE_PASSWORD ZEN_UPLOAD_KEY_ALIAS ZEN_UPLOAD_KEY_PASSWORD
          fi
          if [ -x "./gradlew" ]; then
            ./gradlew -p android clean assembleRelease bundleRelease
          elif [ -x "android/gradlew" ]; then
            ./android/gradlew -p android clean assembleRelease bundleRelease
          else
            gradle -p android clean assembleRelease bundleRelease
          fi

      - name: Verify Clean Compilation & Release AAB Artifact Packaging
        run: |
          echo "=== Verifying Clean Release AAB Artifact Packaging for Google Play Console ==="
          AAB_FILE=$(find android/app/build/outputs/bundle/release -name "*.aab" 2>/dev/null | head -n 1)
          if [ -z "$AAB_FILE" ]; then
            AAB_FILE=$(find . -path "*/build/outputs/bundle/release/*.aab" 2>/dev/null | head -n 1)
          fi
          if [ -z "$AAB_FILE" ] || [ ! -f "$AAB_FILE" ]; then
            echo "::error::Release AAB artifact not found! Clean compilation and release packaging failed."
            exit 1
          fi
          AAB_SIZE=$(stat -c%s "$AAB_FILE" 2>/dev/null || stat -f%z "$AAB_FILE" 2>/dev/null || wc -c < "$AAB_FILE")
          if [ "$AAB_SIZE" -le 1024 ]; then
            echo "::error::Release AAB artifact is abnormally small ($AAB_SIZE bytes)."
            exit 1
          fi
          echo "✓ Clean compilation confirmed."
          echo "✓ Release AAB artifact detected at: $AAB_FILE ($AAB_SIZE bytes)"
          echo "✓ SHA-256 Checksum: $(sha256sum "$AAB_FILE" | awk '{print $1}')"
          echo "✓ Ready for Google Play Console deployment."

      - name: Upload APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deep-focus-release-build
          if-no-files-found: error
          path: |
            **/build/outputs/apk/release/*.apk
            **/build/outputs/bundle/release/*.aab

      - name: Upload Google Play Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deep-focus-google-play-release-bundle-v430.0.0
          if-no-files-found: error
          path: |
            **/build/outputs/bundle/release/*.aab
            **/build/outputs/mapping/release/*.txt
