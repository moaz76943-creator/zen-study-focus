name: Deep Focus Design Change Requests

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  propose:
    name: Create safe design PR from owner-approved issue
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[DESIGN] Review Deep Focus appearance overrides')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const issue=context.payload.issue;
            const raw=issue.body||'';
            if(raw.length>18000)throw Error('Request body exceeds bound.');
            const match=raw.match(/--- START CONFIG JSON ---\s*([\s\S]*?)\s*--- END CONFIG JSON ---/);
            const refMatch=raw.match(/^Reference SHA: ([a-f0-9]{40})$/m);
            if(!match||!refMatch)throw Error('Invalid control-center request format.');
            const designCore=require('./docs/control-center/studio-core.js');
            const proposed=designCore.validateConfig(JSON.parse(match[1]));
            const stylesheet=designCore.renderCSS(proposed);
            const branchName=context.payload.repository.default_branch;
            const main=await github.rest.repos.getBranch({owner,repo,branch:branchName});
            const head=main.data.commit.sha;
            if(refMatch[1]!==head)throw Error('Stale source SHA; reload dashboard and submit a new request.');
            const configPath='docs/control-center/design-config.json';
            const cssPath='android/app/src/main/assets/web/control_center_overrides.css';
            const [existingConfig,existingCSS]=await Promise.all([
              github.rest.repos.getContent({owner,repo,path:configPath,ref:branchName}),
              github.rest.repos.getContent({owner,repo,path:cssPath,ref:branchName})
            ]);
            if(Array.isArray(existingConfig.data)||Array.isArray(existingCSS.data))throw Error('Expected files, not directories.');
            const originalConfig=JSON.parse(Buffer.from(existingConfig.data.content,'base64').toString('utf8'));
            const originalCSS=Buffer.from(existingCSS.data.content,'base64').toString('utf8');
            if(originalCSS!==designCore.renderCSS(originalConfig))throw Error('Default branch has stale generated CSS.');
            const newConfig=JSON.stringify(proposed,null,2)+'\n';
            if(newConfig===JSON.stringify(originalConfig,null,2)+'\n'){
              core.info('No changes in proposed appearance values.');
              return;
            }
            const branch='control-center/design-issue-'+issue.number;
            await github.rest.git.createRef({owner,repo,ref:'refs/heads/'+branch,sha:head});
            await github.rest.repos.createOrUpdateFileContents({
              owner,repo,path:configPath,branch,
              message:'style(control-center): stage reviewed settings from issue #'+issue.number,
              sha:existingConfig.data.sha,
              content:Buffer.from(newConfig).toString('base64')
            });
            await github.rest.repos.createOrUpdateFileContents({
              owner,repo,path:cssPath,branch,
              message:'style(control-center): regenerate cosmetic overrides',
              sha:existingCSS.data.sha,
              content:Buffer.from(stylesheet).toString('base64')
            });
            const pr=await github.rest.pulls.create({
              owner,repo,head:branch,base:branchName,draft:true,
              title:'[DESIGN] Screen appearance update from issue #'+issue.number,
              body:'Generated from owner-created issue #'+issue.number+
                ' on pinned SHA '+head+
                '. Only strictly validated design-config.json and matching CSS may change. '+
                'Human review + Node regression/Android QA required. No automatic merge or release.'
            });
            await github.rest.issues.createComment({
              owner,repo,issue_number:issue.number,
              body:'Created review-only draft PR: '+pr.data.html_url+
                '\nNo app release was performed. Check the workflow tests and screen preview.'
            });
