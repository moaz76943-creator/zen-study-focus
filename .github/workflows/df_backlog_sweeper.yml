name: Deep Focus Heavy PR Backlog Agents
on:
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/df_backlog_sweeper.yml'
      - 'tools/ai_agents/backlog_sweeper.mjs'
      - 'tests/ai_agents/backlog_sweeper.test.mjs'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/df_backlog_sweeper.yml'
      - 'tools/ai_agents/backlog_sweeper.mjs'
      - 'tests/ai_agents/backlog_sweeper.test.mjs'
permissions:
  contents: read
concurrency:
  group: df-heavy-backlog-agents
  cancel-in-progress: false
jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/ai_agents/backlog_sweeper.test.mjs
  heavy-sweep:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      DF_AI_ENABLED: ${{ vars.DF_AI_ENABLED }}
      DF_SWEEP_ALLOW_CLOSE: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify comparison and fail-closed tests
        run: node --test tests/ai_agents/backlog_sweeper.test.mjs
      - name: Audit 16 PRs and close only byte-identical safe superseded drafts
        run: node tools/ai_agents/backlog_sweeper.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deep-focus-backlog-agent-evidence
          path: ${{ runner.temp }}/df-backlog/
          retention-days: 7
          if-no-files-found: warn
