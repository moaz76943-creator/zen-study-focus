name: Deep Focus exact-SHA Android verification (release locked)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Request publication (all exact-SHA/device/media/data/locale gates must pass)'
        type: boolean
        required: true
        default: false
      release_sha:
        description: 'Exact reviewed 40-character commit SHA; required only for publication'
        type: string
        required: false
        default: ''

permissions:
  contents: read
concurrency:
  group: deep-focus-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify release firewall and automation contracts
        run: |
          node --check tools/release_guard/guard.cjs
          node --test tests/release_guard/*.test.cjs tests/daily_maintenance/*.test.cjs
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - name: Build Debug APK only (not an approved release)
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Attach exact checked-out SHA and APK fingerprint
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/SOURCE_SHA
          sha256sum android/app/build/outputs/apk/debug/*.apk | tee evidence/DEBUG_APK_SHA256
          printf 'NOT_RELEASE_APPROVED; SOURCE_BRANCH=%s\n' "$GITHUB_REF" > evidence/STATUS
      - uses: actions/upload-artifact@v4
        with:
          name: DeepFocus-Exact-SHA-Debug-Only
          retention-days: 3
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/*.apk
            evidence/

  release:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fail closed on stale or unreviewed release candidate
        env:
          EXPECTED_RELEASE_SHA: ${{ inputs.release_sha }}
          ZEN_RELEASE_APPROVED_SHA: ${{ vars.ZEN_RELEASE_APPROVED_SHA }}
          ZEN_CANDIDATE_SHA: ${{ vars.ZEN_CANDIDATE_SHA }}
          ZEN_MEDIA_LICENSES_APPROVED: ${{ vars.ZEN_MEDIA_LICENSES_APPROVED }}
          ZEN_ANDROID_E2E_APPROVED: ${{ vars.ZEN_ANDROID_E2E_APPROVED }}
          ZEN_BACKUP_RESTORE_APPROVED: ${{ vars.ZEN_BACKUP_RESTORE_APPROVED }}
          ZEN_20_LOCALES_APPROVED: ${{ vars.ZEN_20_LOCALES_APPROVED }}
          ZEN_HUMAN_RELEASE_APPROVED: ${{ vars.ZEN_HUMAN_RELEASE_APPROVED }}
          ZEN_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ZEN_UPLOAD_KEYSTORE_BASE64 }}
          ZEN_UPLOAD_STORE_PASSWORD: ${{ secrets.ZEN_UPLOAD_STORE_PASSWORD }}
          ZEN_UPLOAD_KEY_ALIAS: ${{ secrets.ZEN_UPLOAD_KEY_ALIAS }}
          ZEN_UPLOAD_KEY_PASSWORD: ${{ secrets.ZEN_UPLOAD_KEY_PASSWORD }}
        run: node tools/release_guard/guard.cjs
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - name: Decode reviewed upload signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ZEN_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/zen-upload.jks"
          echo "ZEN_UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/zen-upload.jks" >> "$GITHUB_ENV"
      - name: Build signed, approved Release APK and AAB
        working-directory: android
        env:
          ZEN_UPLOAD_STORE_PASSWORD: ${{ secrets.ZEN_UPLOAD_STORE_PASSWORD }}
          ZEN_UPLOAD_KEY_ALIAS: ${{ secrets.ZEN_UPLOAD_KEY_ALIAS }}
          ZEN_UPLOAD_KEY_PASSWORD: ${{ secrets.ZEN_UPLOAD_KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease --no-daemon
      - name: Verify both Android signatures and record provenance
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print -quit)"
          test -x "$apksigner"
          for apk in android/app/build/outputs/apk/release/*.apk; do "$apksigner" verify "$apk"; done
          for aab in android/app/build/outputs/bundle/release/*.aab; do jarsigner -verify "$aab"; done
          mkdir -p evidence
          git rev-parse HEAD > evidence/SOURCE_SHA
          sha256sum android/app/build/outputs/apk/release/*.apk android/app/build/outputs/bundle/release/*.aab > evidence/RELEASE_SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: DeepFocus-Reviewed-Signed-Release
          retention-days: 7
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            evidence/
      - name: Publish GitHub release only after all gates
        uses: softprops/action-gh-release@v2
        with:
          tag_name: reviewed-${{ github.run_number }}
          name: Deep Focus SHA-reviewed build ${{ github.sha }}
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
