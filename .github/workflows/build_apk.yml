name: Build Android APK & Play Store AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Explicit human-approved GitHub Release; never publish on push or cron'
        type: boolean
        required: true
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Release APK and Play Store AAB
        working-directory: ./android
        run: |
          gradle assembleRelease bundleRelease --no-daemon

      - name: Upload APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZenStudyFocus-Pro-Builds
          retention-days: 3
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true && github.ref == 'refs/heads/main'
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Zen Study Focus Pro v2.0.${{ github.run_number }}
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
