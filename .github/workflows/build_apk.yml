# Mission #177 debug APK. Checkout is pinned to the annotated release tag's peeled commit.
# This workflow never checks out main, legacy branches, or previous production commits.
name: Deep Focus v3.0.3 Sanitized - Verified Debug APK

on:
  push:
    branches:
      - integration/master-qa-verified-v21
    paths:
      - .github/workflows/build_apk.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deep-focus-sanitized_v303-debug-apk
  cancel-in-progress: false

jobs:
  sanitized_v303-debug-apk:
    name: Build and verify v3.0.3 Sanitized debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout pinned v3.0.3 Sanitized release commit
        uses: actions/checkout@v4
        with:
          ref: 01348f731a37db99edbe15d8dc3914c6ba250f79
          persist-credentials: false
      - name: Verify approved tag and checkout integrity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "01348f731a37db99edbe15d8dc3914c6ba250f79"
          TAG_TARGET="$(git ls-remote origin 'refs/tags/v3.0.3-sanitized-production-v21^{}' | awk '{print $1}')"
          test "$TAG_TARGET" = "01348f731a37db99edbe15d8dc3914c6ba250f79" || { echo "::error::Release tag no longer points to approved v3.0.3 Sanitized commit"; exit 1; }
          test -f android/app/src/main/assets/web/js/deep_focus_runtime_activator.js
          test ! -e android/app/src/main/assets/web/js/deep_focus_visual_suite.js
          grep -Fq '<script src="js/deep_focus_runtime_activator.js"></script>' android/app/src/main/assets/web/index.html
          ! grep -Fq 'deep_focus_visual_suite.js' android/app/src/main/assets/web/index.html
          echo "Validated tag v3.0.3-sanitized-production-v21 at commit 01348f731a37db99edbe15d8dc3914c6ba250f79"
      - name: Validate runtime activator and sanitized UI
        shell: bash
        run: |
          node --check android/app/src/main/assets/web/js/deep_focus_runtime_activator.js
          # Legacy Mission 176 integration test checks removed audio symbols and an obsolete locale variable.
          # Replace the obsolete name-based assertions with focused v3.0.3 source checks.
          node -e 'const fs=require("node:fs");const a=require("node:assert/strict");const s=fs.readFileSync("android/app/src/main/assets/web/js/deep_focus_runtime_activator.js","utf8");const m=s.match(/const LOCALES_100 = \\[([\\s\\S]*?)\\];/);a.ok(m,"100-locale catalog");const codes=[...m[1].matchAll(/\\bcode:\\s*"([^"]+)"/g)].map(x=>x[1]);a.equal(codes.length,100);a.equal(new Set(codes).size,100);a.ok(codes.includes("sw")&&codes.includes("ur"));a.ok(!codes.includes("he")&&!codes.includes("iw"));a.ok(s.includes("function toWesternDigits("));a.ok(s.includes("class SilentNatureAudio"));console.log("PASS: 100 unique locales, forbidden locale exclusion, sanitized runtime checks");'
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Generate Gradle wrapper on runner (repository has none)
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f ./gradlew ]]; then
            gradle wrapper --gradle-version 8.11.1 --distribution-type bin --no-daemon
          fi
          chmod +x ./gradlew
      - name: Build v3.0.3 Sanitized APK exactly as requested
        working-directory: android
        shell: bash
        run: ./gradlew clean assembleDebug --stacktrace
      - name: Verify debug signing, package, assets and compute SHA256
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/sanitized_v303-signature.txt"
          "$AAPT" dump badging "$APK" | tee "$RUNNER_TEMP/sanitized_v303-badging.txt"
          grep -Eq "package: name='com.zenstudy.focus'" "$RUNNER_TEMP/sanitized_v303-badging.txt"
          unzip -Z -1 "$APK" | grep -Fxq 'assets/web/js/deep_focus_runtime_activator.js'
          if unzip -Z -1 "$APK" | grep -Fxq 'assets/web/js/deep_focus_visual_suite.js'; then echo '::error::Removed visual suite was packaged'; exit 1; fi
          unzip -Z -1 "$APK" | grep -Fxq 'assets/web/index.html'
          sha256sum "$APK" | tee "$RUNNER_TEMP/sanitized_v303-sha256.txt"
          {
            echo "tag=v3.0.3-sanitized-production-v21"
            echo "source_commit=01348f731a37db99edbe15d8dc3914c6ba250f79"
            echo "build_command=./gradlew clean assembleDebug --stacktrace"
            echo "package=com.zenstudy.focus"
            echo "signing=Android debug signing key (not Google Play upload signing)"
          } > "$RUNNER_TEMP/sanitized_v303-provenance.txt"
          {
            echo "### v3.0.3 Sanitized verified Debug APK"
            echo "Source: \`v3.0.3-sanitized-production-v21\` / \`01348f731a37db99edbe15d8dc3914c6ba250f79\`"
            echo "Package: \`com.zenstudy.focus\`"
            echo "APK SHA256:"
            echo '\`\`\`'
            cat "$RUNNER_TEMP/sanitized_v303-sha256.txt"
            echo '\`\`\`'
            echo "This APK has the Android debug signature, not a Play release upload signature."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload verified APK, SHA256 and signing evidence
        uses: actions/upload-artifact@v4
        with:
          name: DeepFocus-Sanitized-v3.0.3-v3.0.3-Debug-APK
          if-no-files-found: error
          retention-days: 30
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            ${{ runner.temp }}/sanitized_v303-sha256.txt
            ${{ runner.temp }}/sanitized_v303-provenance.txt
            ${{ runner.temp }}/sanitized_v303-signature.txt
            ${{ runner.temp }}/sanitized_v303-badging.txt
