name: Mass merge exact-source debug verification
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact application SHA to compile; debug only
        required: true
        type: string
      apk_run_id:
        description: Existing exact-source debug run for Android UI validation
        required: false
        default: ""
        type: string
permissions:
  contents: read
jobs:
  verify:
    if: inputs.apk_run_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Verify exact source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          node --check android/app/src/main/assets/web/app.js
          node --test tests/termux_fix01_consent_kickstart_digits.test.cjs tests/data_contracts/data_compat_v21.test.cjs tests/termux_fix05_language_picker_and_starter_data.test.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0' 
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Record source and artifact fingerprints
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/SOURCE_SHA
          sha256sum android/app/build/outputs/apk/debug/*.apk > evidence/DEBUG_APK_SHA256
          echo 'RELEASE_APPROVED=NO' > evidence/STATUS
      - uses: actions/upload-artifact@v4
        with:
          name: mass-merge-debug-${{ inputs.source_sha }}
          retention-days: 3
          path: |
            evidence/
            android/app/build/outputs/apk/debug/*.apk

  android-ui:
    if: inputs.apk_run_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@v4
        with:
          name: mass-merge-debug-${{ inputs.source_sha }}
          run-id: ${{ inputs.apk_run_id }}
          github-token: ${{ github.token }}
      - name: Verify downloaded exact-source APK
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$(cat evidence/SOURCE_SHA)" = "$SOURCE_SHA"
          sha256sum --check evidence/DEBUG_APK_SHA256
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM for disposable emulator
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python .github/scripts/df_locale_android_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mass-merge-android-ui-${{ inputs.source_sha }}
          retention-days: 3
          path: evidence/
