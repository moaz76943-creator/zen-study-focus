name: Verify Android APK and Play Bundle

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install platform API 36 with runner SDK
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: JavaScript syntax
        run: node --check android/app/src/main/assets/web/app.js
      - name: Build test APK and unsigned Play bundle
        working-directory: android
        run: gradle assembleDebug bundleRelease --no-daemon
      - name: Source safety regression checks
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Upload test builds - not Play signed
        uses: actions/upload-artifact@v4
        with:
          name: ZenFocus-Test-APK-and-Unsigned-AAB
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab

  signed-release:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      KEYSTORE_B64: ${{ secrets.ZEN_UPLOAD_KEYSTORE_BASE64 }}
      ZEN_UPLOAD_STORE_PASSWORD: ${{ secrets.ZEN_UPLOAD_STORE_PASSWORD }}
      ZEN_UPLOAD_KEY_ALIAS: ${{ secrets.ZEN_UPLOAD_KEY_ALIAS }}
      ZEN_UPLOAD_KEY_PASSWORD: ${{ secrets.ZEN_UPLOAD_KEY_PASSWORD }}
    steps:
      - name: Verify signing requirements
        id: sign
        shell: bash
        run: |
          if [[ -n "$KEYSTORE_B64" && -n "$ZEN_UPLOAD_STORE_PASSWORD" && -n "$ZEN_UPLOAD_KEY_ALIAS" && -n "$ZEN_UPLOAD_KEY_PASSWORD" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Play release not published: configure ZEN_UPLOAD_KEYSTORE_BASE64 and three upload-key secrets."
          fi
      - uses: actions/checkout@v4
        if: steps.sign.outputs.ready == 'true'
      - uses: actions/setup-java@v4
        if: steps.sign.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - name: Android API 36
        if: steps.sign.outputs.ready == 'true'
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        if: steps.sign.outputs.ready == 'true'
        with:
          gradle-version: '8.11.1'
      - name: Prepare upload keystore
        if: steps.sign.outputs.ready == 'true'
        shell: bash
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/zen-upload.jks"
          echo "ZEN_UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/zen-upload.jks" >> "$GITHUB_ENV"
      - name: Build signed APK and Play AAB
        if: steps.sign.outputs.ready == 'true'
        working-directory: android
        run: gradle assembleRelease bundleRelease --no-daemon
      - name: Upload signed APK and AAB
        if: steps.sign.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ZenFocus-Signed-Play-Release
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
      - name: Publish signed release
        if: steps.sign.outputs.ready == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v21.${{ github.run_number }}
          name: Zen Focus signed release v21.${{ github.run_number }}
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
