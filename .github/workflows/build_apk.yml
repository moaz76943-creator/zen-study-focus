# Mission #176 debug APK. Checkout is pinned to the annotated release tag's peeled commit.
# This workflow never checks out main, legacy branches, or previous production commits.
name: Deep Focus Mission 176 - Verified Debug APK

on:
  push:
    branches:
      - integration/master-qa-verified-v21
    paths:
      - .github/workflows/build_apk.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deep-focus-mission176-debug-apk
  cancel-in-progress: false

jobs:
  mission176-debug-apk:
    name: Build and verify Mission 176 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout pinned Mission 176 release commit
        uses: actions/checkout@v4
        with:
          ref: 26f0a1d64ad093423fffb8d47df6714bc608561f
          persist-credentials: false
      - name: Verify approved tag and checkout integrity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "26f0a1d64ad093423fffb8d47df6714bc608561f"
          TAG_TARGET="$(git ls-remote origin 'refs/tags/v3.0.1-runtime-activated-v21^{}' | awk '{print $1}')"
          test "$TAG_TARGET" = "26f0a1d64ad093423fffb8d47df6714bc608561f" || { echo "::error::Release tag no longer points to approved Mission 176 commit"; exit 1; }
          test -f android/app/src/main/assets/web/js/deep_focus_runtime_activator.js
          grep -Fq '<script src="js/deep_focus_runtime_activator.js"></script>' android/app/src/main/assets/web/index.html
          echo "Validated tag v3.0.1-runtime-activated-v21 at commit 26f0a1d64ad093423fffb8d47df6714bc608561f"
      - name: Validate runtime activator syntax
        shell: bash
        run: |
          node --check android/app/src/main/assets/web/js/deep_focus_runtime_activator.js
          node --test test/runtime_activator_integration.test.js
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Generate Gradle wrapper on runner (repository has none)
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f ./gradlew ]]; then
            gradle wrapper --gradle-version 8.11.1 --distribution-type bin --no-daemon
          fi
          chmod +x ./gradlew
      - name: Build Mission 176 APK exactly as requested
        working-directory: android
        shell: bash
        run: ./gradlew clean assembleDebug --stacktrace
      - name: Verify debug signing, package, assets and compute SHA256
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/mission176-signature.txt"
          "$AAPT" dump badging "$APK" | tee "$RUNNER_TEMP/mission176-badging.txt"
          grep -Eq "package: name='com.zenstudy.focus'" "$RUNNER_TEMP/mission176-badging.txt"
          unzip -Z -1 "$APK" | grep -Fxq 'assets/web/js/deep_focus_runtime_activator.js'
          unzip -Z -1 "$APK" | grep -Fxq 'assets/web/index.html'
          sha256sum "$APK" | tee "$RUNNER_TEMP/mission176-sha256.txt"
          {
            echo "tag=v3.0.1-runtime-activated-v21"
            echo "source_commit=26f0a1d64ad093423fffb8d47df6714bc608561f"
            echo "build_command=./gradlew clean assembleDebug --stacktrace"
            echo "package=com.zenstudy.focus"
            echo "signing=Android debug signing key (not Google Play upload signing)"
          } > "$RUNNER_TEMP/mission176-provenance.txt"
          {
            echo "### Mission 176 verified Debug APK"
            echo "Source: \`v3.0.1-runtime-activated-v21\` / \`26f0a1d64ad093423fffb8d47df6714bc608561f\`"
            echo "Package: \`com.zenstudy.focus\`"
            echo "APK SHA256:"
            echo '\`\`\`'
            cat "$RUNNER_TEMP/mission176-sha256.txt"
            echo '\`\`\`'
            echo "This APK has the Android debug signature, not a Play release upload signature."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload verified APK, SHA256 and signing evidence
        uses: actions/upload-artifact@v4
        with:
          name: DeepFocus-Mission176-v3.0.1-Debug-APK
          if-no-files-found: error
          retention-days: 30
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            ${{ runner.temp }}/mission176-sha256.txt
            ${{ runner.temp }}/mission176-provenance.txt
            ${{ runner.temp }}/mission176-signature.txt
            ${{ runner.temp }}/mission176-badging.txt
