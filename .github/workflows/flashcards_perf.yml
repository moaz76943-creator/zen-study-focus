name: Flashcards performance and quota (real Chromium)
on:
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:
  pull_request:
    branches: [integration/master-qa-verified-v21]
    paths: ['tools/perf/**', 'android/app/src/main/assets/web/modules/flashcards/**']
permissions:
  contents: read
jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: '22' }
      - run: npm install --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: node tools/perf/flashcards_perf.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: flashcards-perf, path: perf-out/, retention-days: 14 }
