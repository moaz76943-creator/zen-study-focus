name: Deep Focus Android WebView Real DOM (debug-only)
on:
  # One disposable real Android run for this integration branch; production excluded.
  push:
    branches: [integration/deep-focus-stability-20261020, fix/df4-android-touch-evidence-20261020, fix/df4-notes-save-visible-android-20261020, integration/deep-focus-consolidated-candidate-20261020, fix/codex-phase1-stabilization-20261020, review/track06-gated-checkpoint-20261020, review/track07-09-phase3-candidate-20261020, test/track02-integrated-native-saf-qa-20261021]
  workflow_dispatch:
    inputs:
      api:
        description: Disposable Android API to verify (separate compatibility evidence)
        required: true
        default: '35'
        type: choice
        options: ['35', '30']
      scope:
        description: Full acceptance or focused task durability diagnosis (unexecuted cases remain NOT_TESTED)
        required: true
        default: 'full'
        type: choice
        options: ['full', 'task_persistence']
permissions:
  contents: read
concurrency:
  group: deep-focus-real-webview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-webview-smoke:
    name: Fresh Android API${{ inputs.api || '30' }}, local DevTools DOM, test-only
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_TEST_API: ${{ inputs.api || '30' }}
      DF_ANDROID_CASES: ${{ (github.ref_name == 'fix/codex-phase1-stabilization-20261020' || inputs.scope == 'task_persistence') && 'preflight,tasks_create,task_subtasks' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Debug-only access and script safety regressions
        run: |
          node --check tests/android_e2e_recovery/cdp_dom_smoke.cjs
          node --check tests/android_e2e_recovery/track07_durability_android.cjs
          node --test tests/android_e2e_recovery/cdp_debug_gate.test.cjs tests/android_e2e_recovery/android_ui_hierarchy.test.cjs
          git rev-parse HEAD
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API36 for compilation
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile isolated debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Prepare ADB test diagnostics
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/deep-focus-android-webview"
          git rev-parse HEAD > "$RUNNER_TEMP/deep-focus-android-webview/source-sha.txt"
          sha256sum android/app/build/outputs/apk/debug/*.apk > "$RUNNER_TEMP/deep-focus-android-webview/apk.sha256"
          test -c /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          sudo chmod u+rw /dev/kvm
      - name: Inspect actual on-emulator WebView DOM (no simulated PASS)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api || '30' }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          disable-animations: true
          script: bash tests/android_e2e_recovery/run_cdp_ci.sh
      - name: Record unverified emulator bootstrap on infrastructure failure
        if: failure()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/deep-focus-android-webview"
          if [ ! -s "$RUNNER_TEMP/deep-focus-android-webview/results.json" ]; then
            printf '%s\n' '{"status":"NOT_TESTED","reason":"Android emulator bootstrap or CDP forwarding failed before verified app DOM evidence; inspect run logs"}' > "$RUNNER_TEMP/deep-focus-android-webview/results.json"
          fi
      - name: Preserve real Android evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DeepFocus-Android-WebView-Real-DOM-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 7
          path: ${{ runner.temp }}/deep-focus-android-webview/
