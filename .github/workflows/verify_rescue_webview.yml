name: Deep Focus Android WebView Real DOM (debug-only)
on:
  # Optional exact-SHA QA, manually started after emulator SDK is healthy.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deep-focus-real-webview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-webview-smoke:
    name: Fresh Android API35, local DevTools DOM, test-only
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Debug-only access and script safety regressions
        run: |
          node --check tests/android_e2e_recovery/cdp_dom_smoke.cjs
          node --test tests/android_e2e_recovery/cdp_debug_gate.test.cjs
          git rev-parse HEAD
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API36 for compilation
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile isolated debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Prepare ADB test diagnostics
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/deep-focus-android-webview"
          git rev-parse HEAD > "$RUNNER_TEMP/deep-focus-android-webview/source-sha.txt"
          sha256sum android/app/build/outputs/apk/debug/*.apk > "$RUNNER_TEMP/deep-focus-android-webview/apk.sha256"
          test -c /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          sudo chmod u+rw /dev/kvm
      - name: Inspect actual on-emulator WebView DOM (no simulated PASS)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            set -euo pipefail
            report="$RUNNER_TEMP/deep-focus-android-webview"
            capture() {
              adb exec-out screencap -p > "$report/screen.png" || true
              adb shell uiautomator dump /sdcard/rescue-webview.xml >/dev/null 2>&1 || true
              adb exec-out cat /sdcard/rescue-webview.xml > "$report/hierarchy.xml" || true
              adb logcat -d -s AndroidRuntime chromium > "$report/logcat.txt" || true
              adb forward --remove tcp:9222 >/dev/null 2>&1 || true
            }
            trap capture EXIT
            adb install android/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant com.zenstudy.focus android.permission.POST_NOTIFICATIONS || true
            adb shell am start -n com.zenstudy.focus/.MainActivity
            sleep 5
            pid="$(adb shell pidof com.zenstudy.focus | tr -d '\r' | awk '{print $1}')"
            test -n "$pid"
            adb forward tcp:9222 "localabstract:webview_devtools_remote_${pid}"
            node tests/android_e2e_recovery/cdp_dom_smoke.cjs "$report/results.json"
      - name: Record unverified emulator bootstrap on infrastructure failure
        if: failure()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/deep-focus-android-webview"
          if [ ! -s "$RUNNER_TEMP/deep-focus-android-webview/results.json" ]; then
            printf '%s\n' '{"status":"NOT_TESTED","reason":"Android emulator bootstrap or CDP forwarding failed before verified app DOM evidence; inspect run logs"}' > "$RUNNER_TEMP/deep-focus-android-webview/results.json"
          fi
      - name: Preserve real Android evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DeepFocus-Android-WebView-Real-DOM-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 7
          path: ${{ runner.temp }}/deep-focus-android-webview/
