name: Deep Focus v3.3.2 Production Ready Signed AAB and Debug APK
on:
  push:
    branches: [integration/master-qa-verified-v21]
    paths: [.github/workflows/build_v332_production_ready.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      ZEN_UPLOAD_STORE_PASSWORD: ${{ secrets.ZEN_UPLOAD_STORE_PASSWORD }}
      ZEN_UPLOAD_KEY_ALIAS: ${{ secrets.ZEN_UPLOAD_KEY_ALIAS }}
      ZEN_UPLOAD_KEY_PASSWORD: ${{ secrets.ZEN_UPLOAD_KEY_PASSWORD }}
      ZEN_PLAY_UPLOAD_SHA1: ${{ secrets.ZEN_PLAY_UPLOAD_SHA1 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d2c3f9b6c2e9fa6a3b1eead93b22e27a580b9ff9
          persist-credentials: false
      - name: Verify exact tag, unchanged assets and no foreground service
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=d2c3f9b6c2e9fa6a3b1eead93b22e27a580b9ff9
          test "$(git rev-parse HEAD)" = "$SOURCE"
          TAG_SHA="$(git ls-remote origin 'refs/tags/v3.3.2-production-ready-v21^{}' | awk '{print $1}')"
          test "$TAG_SHA" = "$SOURCE"
          test -z "$(git status --porcelain)"
          node --check android/app/src/main/assets/web/app.js
          node --test tests/no_fg_service_play_v23.test.cjs
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          main=Path('android/app/src/main')
          gradle=Path('android/app/build.gradle').read_text()
          manifest=(main/'AndroidManifest.xml').read_text()
          for setting in ('applicationId "com.deepfocus.study"','versionCode 23','versionName "3.1.4"','targetSdk 36'):
              assert setting in gradle, setting
          for bad in ('android.permission.FOREGROUND_SERVICE','android.permission.FOREGROUND_SERVICE_SPECIAL_USE','foregroundServiceType','<service'):
              assert bad not in manifest, bad
          assert '.FocusAlarmReceiver' in manifest
          assert not (main/'java/com/zenstudy/focus/FocusTimerService.java').exists()
          assert (main/'java/com/zenstudy/focus/FocusAlarmReceiver.java').exists()
          assert 'com.deepfocus.study' in (main/'java/com/zenstudy/focus/MainActivity.java').read_text()
          web=main/'assets/web'
          app=(web/'app.js').read_text()
          match=re.search(r'const LANG_CATALOG\s*=\s*(\[[\s\S]*?\])\s*;',app)
          assert match
          entries=json.loads(match.group(1))
          assert len(entries)==len(set(x['code'] for x in entries))==99, 'Catalog differs from tagged source inventory'
          for name in ['index.html','locale_extras.js','locale_rows.js']:
              assert (web/name).stat().st_size>1000, name
          assert 'deep_focus_runtime_activator.js' in (web/'index.html').read_text()
          for name in ['campfire_woods','distant_thunder','night_crickets','ocean_waves','pine_breeze','soft_forest_rain']:
              assert (web/'audio'/(name+'.mp3')).stat().st_size>100000, name
          print('Tagged content verified: no FGS, 99 unique catalog languages, 6 MP3 files.')
          PY
          {
            echo 'tag=v3.3.2-production-ready-v21'
            echo 'source_sha=d2c3f9b6c2e9fa6a3b1eead93b22e27a580b9ff9'
            echo 'tag_source_edits=NONE'
            echo 'package=com.deepfocus.study'
            echo 'versionCode=23'
            echo 'versionName=3.1.4'
            echo 'language_catalog_count=99'
            echo 'audio_mp3_files=6'
            echo 'play_acceptance=NOT_TESTED'
          } > "$RUNNER_TEMP/v332-provenance.txt"
      - name: Validate private Release Keystore
        shell: bash
        env:
          ZEN_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ZEN_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ZEN_UPLOAD_KEYSTORE_BASE64" && test -n "$ZEN_UPLOAD_STORE_PASSWORD" && test -n "$ZEN_UPLOAD_KEY_ALIAS" && test -n "$ZEN_UPLOAD_KEY_PASSWORD" || { echo '::error::Missing Release signing secrets'; exit 1; }
          umask 077
          STORE="$RUNNER_TEMP/v332-play-upload.jks"
          printf '%s' "$ZEN_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$STORE"
          test -s "$STORE"
          echo "ZEN_UPLOAD_KEYSTORE_PATH=$STORE" >> "$GITHUB_ENV"
          keytool -list -v -keystore "$STORE" -alias "$ZEN_UPLOAD_KEY_ALIAS" -storepass:env ZEN_UPLOAD_STORE_PASSWORD > "$RUNNER_TEMP/v332-key-report.txt"
          grep -Fq PrivateKeyEntry "$RUNNER_TEMP/v332-key-report.txt"
          grep -m1 'SHA1:' "$RUNNER_TEMP/v332-key-report.txt" | sed -E 's/^.*SHA1: *//;s/[[:space:]]+$//' > "$RUNNER_TEMP/v332-expected-sha1.txt"
          if test -n "$ZEN_PLAY_UPLOAD_SHA1"; then
            test "$(tr '[:lower:]' '[:upper:]' < "$RUNNER_TEMP/v332-expected-sha1.txt")" = "$(printf '%s' "$ZEN_PLAY_UPLOAD_SHA1" | tr '[:lower:]' '[:upper:]')" || { echo '::error::Upload certificate mismatch'; exit 1; }
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK API36
        shell: bash
        run: |
          set -euo pipefail
          MANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager -print -quit)"
          "$MANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare wrapper if missing
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail
          if [[ ! -f ./gradlew ]]; then gradle wrapper --gradle-version 8.11.1 --distribution-type bin --no-daemon; fi
          chmod +x ./gradlew
      - name: Build signed Play Release AAB
        working-directory: android
        run: ./gradlew clean bundleRelease --stacktrace
      - name: Build device Debug APK from SAME tagged source
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace
      - name: Verify actual AAB and APK manifest, audio assets, hashes and signing
        shell: bash
        run: |
          set -euo pipefail
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$AAB" && test -s "$APK"
          unzip -tq "$AAB" > "$RUNNER_TEMP/v332-aab-integrity.txt"
          unzip -tq "$APK" > "$RUNNER_TEMP/v332-apk-integrity.txt"
          unzip -Z -1 "$AAB" > "$RUNNER_TEMP/v332-aab-files.txt"
          unzip -Z -1 "$APK" > "$RUNNER_TEMP/v332-apk-files.txt"
          for p in index.html app.js locale_rows.js locale_extras.js; do
            grep -Fxq "base/assets/web/$p" "$RUNNER_TEMP/v332-aab-files.txt"
            grep -Fxq "assets/web/$p" "$RUNNER_TEMP/v332-apk-files.txt"
          done
          for s in campfire_woods distant_thunder night_crickets ocean_waves pine_breeze soft_forest_rain; do
            grep -Fxq "base/assets/web/audio/$s.mp3" "$RUNNER_TEMP/v332-aab-files.txt"
            grep -Fxq "assets/web/audio/$s.mp3" "$RUNNER_TEMP/v332-apk-files.txt"
          done
          curl --fail --location --retry 3 --silent --show-error 'https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar' --output "$RUNNER_TEMP/bundletool.jar"
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$AAB" > "$RUNNER_TEMP/v332-aab-manifest.xml"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > "$RUNNER_TEMP/v332-apk-badging.txt"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/v332-apk-signing.txt"
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          r=Path(os.environ['RUNNER_TEMP'])
          root=ET.fromstring((r/'v332-aab-manifest.xml').read_text())
          ns='{http://schemas.android.com/apk/res/android}'
          pkg=root.get('package')
          ver=root.get(ns+'versionName')
          code=root.get(ns+'versionCode')
          sdk=root.find('uses-sdk')
          target=sdk.get(ns+'targetSdkVersion') if sdk is not None else None
          permissions=[x.get(ns+'name','') for x in root.findall('uses-permission')]
          assert pkg=='com.deepfocus.study' and code=='23' and ver=='3.1.4',(pkg,code,ver)
          assert target=='36',target
          assert not [x for x in permissions if 'FOREGROUND_SERVICE' in x or 'EXACT_ALARM' in x],permissions
          assert not root.findall('application/service'),'Unexpected merged foreground service'
          assert any(x.get(ns+'name','').endswith('.FocusAlarmReceiver') for x in root.findall('application/receiver'))
          badge=(r/'v332-apk-badging.txt').read_text()
          assert "package: name='com.deepfocus.study' versionCode='23' versionName='3.1.4'" in badge
          assert 'FOREGROUND_SERVICE' not in badge and 'EXACT_ALARM' not in badge
          report=f'source=d2c3f9b6c2e9fa6a3b1eead93b22e27a580b9ff9\npackage={pkg}\nversionCode={code}\nversionName={ver}\ntargetSdk={target}\nforeground_service_permissions=NONE\nexact_alarm_permissions=NONE\nservices=0\nreceiver=FocusAlarmReceiver\n99_catalog_languages=verified\n6_studio_mp3=verified\n'
          print(report)
          (r/'v332-manifest-proof.txt').write_text(report)
          PY
          jarsigner -verify -verbose -certs "$AAB" > "$RUNNER_TEMP/v332-aab-signature.txt" 2>&1
          grep -Fq 'jar verified.' "$RUNNER_TEMP/v332-aab-signature.txt"
          keytool -printcert -jarfile "$AAB" > "$RUNNER_TEMP/v332-aab-certificate.txt"
          grep -m1 'SHA1:' "$RUNNER_TEMP/v332-aab-certificate.txt" | sed -E 's/^.*SHA1: *//;s/[[:space:]]+$//' > "$RUNNER_TEMP/v332-aab-sha1.txt"
          cmp "$RUNNER_TEMP/v332-expected-sha1.txt" "$RUNNER_TEMP/v332-aab-sha1.txt"
          sha256sum "$AAB" | tee "$RUNNER_TEMP/v332-aab-sha256.txt"
          sha256sum "$APK" | tee "$RUNNER_TEMP/v332-apk-sha256.txt"
          {
            echo '### Exact v3.3.2 Production Ready Tag Build'
            cat "$RUNNER_TEMP/v332-provenance.txt"
            cat "$RUNNER_TEMP/v332-manifest-proof.txt"
            echo 'Release Upload Certificate SHA1:'
            cat "$RUNNER_TEMP/v332-aab-sha1.txt"
            echo 'Signed AAB SHA256:'
            cat "$RUNNER_TEMP/v332-aab-sha256.txt"
            echo 'Debug APK SHA256:'
            cat "$RUNNER_TEMP/v332-apk-sha256.txt"
            echo 'Play Console acceptance, device runtime, media playback and complete translations NOT_TESTED.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: DeepFocus-v3.3.2-TAGGED-v23-PLAY-SIGNED-AAB
          if-no-files-found: error
          retention-days: 30
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            ${{ runner.temp }}/v332-aab-sha1.txt
            ${{ runner.temp }}/v332-aab-sha256.txt
            ${{ runner.temp }}/v332-manifest-proof.txt
            ${{ runner.temp }}/v332-provenance.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DeepFocus-v3.3.2-TAGGED-v23-DEBUG-APK
          if-no-files-found: error
          retention-days: 30
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            ${{ runner.temp }}/v332-apk-sha256.txt
            ${{ runner.temp }}/v332-apk-badging.txt
            ${{ runner.temp }}/v332-manifest-proof.txt
