# Exact localStorage namespace identifiers are public storage labels, not credentials.
# Each allowlist binds exact strings to the one source file that declares them.
[[rules.allowlists]]
description = "Reviewed focus commitment localStorage identifiers"
condition = "AND"
regexTarget = "secret"
regexes = ['''^df_focus_contracts_v1$''', '''^df_contracts_ledger_v1$''']
paths = ['''^android/app/src/main/assets/web/modules/contracts/focus_commitment_contracts\.js$''']

[[rules.allowlists]]
description = "Reviewed fractal garden localStorage identifier"
condition = "AND"
regexTarget = "secret"
regexes = ['''^df_botanical_garden_vault_v1$''']
paths = ['''^android/app/src/main/assets/web/modules/garden/fractal_botanical_engine\.js$''']

[[rules.allowlists]]
