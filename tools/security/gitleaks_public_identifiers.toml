regexTarget = "secret"
regexes = ['''^zen_crypto_signatures_v1$''']
paths = ['''^android/app/src/main/assets/web/modules/security/tamper_proof_integrity_guard\.js$''']

[[rules.allowlists]]
description = "Reviewed application localStorage namespace identifiers"
